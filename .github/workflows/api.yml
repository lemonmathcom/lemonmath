name: Deploy classroom API

# The classroom API (api/, Cloudflare Worker + D1) behind "My classes" and the homework page.
# Runs when something in api/ changes on main, or when you press "Run workflow".
# Needs two repository secrets (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Step by step (Vietnamese): giao-viec/LOP-HOC.md
on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: write   # to record the API address in data/curriculum.json
  actions: write    # to start the website build afterwards

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets
        id: ready
        run: |
          # spaces, line breaks or quotes pasted around the values are removed
          T=$(printf %s "$CF_TOKEN_RAW" | tr -d "[:space:]\"'")
          A=$(printf %s "$CF_ACCOUNT_RAW" | tr -d "[:space:]\"'")
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::warning::Chưa có CLOUDFLARE_API_TOKEN hoặc CLOUDFLARE_ACCOUNT_ID trong Settings → Secrets and variables → Actions. Xem giao-viec/LOP-HOC.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$T"
          echo "Token: ${#T} characters. Account ID: ${#A} characters."
          if ! printf %s "$T" | grep -Eq '^[A-Za-z0-9_-]{30,}$'; then echo "::error::CLOUDFLARE_API_TOKEN không đúng dạng (có thể đã dán thừa chữ). Tạo lại secret, chỉ dán đúng chuỗi token."; exit 1; fi
          if ! printf %s "$A" | grep -Eq '^[0-9a-f]{32}$'; then echo "::error::CLOUDFLARE_ACCOUNT_ID phải là 32 kí tự 0-9, a-f."; exit 1; fi
          echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$A" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v6

      - name: Setup Node
        if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install wrangler
        if: steps.ready.outputs.ok == 'true'
        working-directory: api
        run: npm ci

      - name: Database (created once, in Asia-Pacific) and its tables
        if: steps.ready.outputs.ok == 'true'
        working-directory: api
        run: |
          find_id() { npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s.slice(s.indexOf('['))).find(d=>d.name==='lemonmath');process.stdout.write(x?String(x.uuid||x.id||''):'')})"; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create lemonmath --location apac
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then echo "::error::Không tạo hoặc tìm được cơ sở dữ liệu D1 tên lemonmath."; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          npx wrangler d1 migrations apply lemonmath --remote

      - name: Deploy the Worker
        if: steps.ready.outputs.ok == 'true'
        id: deploy
        working-directory: api
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::Không thấy địa chỉ workers.dev. Mở Cloudflare → Workers & Pages một lần để đặt tên miền con workers.dev, rồi chạy lại."; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Secret key (made once, never replaced)
        if: steps.ready.outputs.ok == 'true'
        working-directory: api
        run: |
          # A new key would lock every teacher out, so stop if the list cannot be read.
          LIST=$(npx wrangler secret list)
          if echo "$LIST" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s.slice(s.indexOf('[')));process.exit(l.some(x=>x.name==='PEPPER')?0:3)})"; then
            echo "PEPPER is already set."
          else
            code=$?
            if [ "$code" != "3" ]; then echo "::error::Không đọc được danh sách secret."; exit 1; fi
            head -c 48 /dev/urandom | base64 | tr -d '\n=+/' | npx wrangler secret put PEPPER
          fi

      - name: Check the API answers
        if: steps.ready.outputs.ok == 'true'
        run: |
          # a new workers.dev address can take a minute to answer
          for i in $(seq 1 18); do
            if curl -fsS "${{ steps.deploy.outputs.url }}/" | grep -q lemonmath-api; then echo "API answers."; exit 0; fi
            sleep 10
          done
          echo "::error::Máy chủ chưa trả lời sau 3 phút."; exit 1

      - name: Tell the website where the API is
        if: steps.ready.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(node api/scripts/set-site-api.mjs '${{ steps.deploy.outputs.url }}')" = "changed" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
            git add data/curriculum.json
            git commit -m "Lớp học: ghi địa chỉ máy chủ ${{ steps.deploy.outputs.url }}"
            git push
            gh workflow run deploy.yml --ref main
          fi
