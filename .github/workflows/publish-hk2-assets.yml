name: Publish 2025–2026 semester II PDFs and QR pages

on:
  push:
    branches: [xuat-ban-hk2-assets-2025-2026]
    paths:
      - 'publication/hk2/**'
      - '.github/workflows/publish-hk2-assets.yml'

permissions:
  contents: read

concurrency:
  group: lemonmath-qr-r2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --prefix api
      - name: Publish to the current R2 bucket and QR Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: python3 -u publication/hk2/publish.py
