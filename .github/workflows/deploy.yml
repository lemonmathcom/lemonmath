name: Build and deploy website

# Runs every time you save a change on the main branch (or when you press "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history, so each page can show its real "last updated" date

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      # Stage 2 of the hosting plan (26/11/2026): the same dist/ also goes to Cloudflare Workers as static files
      # (site/wrangler.jsonc, wrangler pinned in api/package.json). Until lemonmath.com points to Cloudflare this copy
      # only answers at lemonmath-site.<account>.workers.dev. A failure here never stops the GitHub Pages deploy.
      - name: Cloudflare secrets
        id: cf
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          T=$(printf %s "$CF_TOKEN_RAW" | tr -d "[:space:]\"'")
          A=$(printf %s "$CF_ACCOUNT_RAW" | tr -d "[:space:]\"'")
          if [ -z "$T" ] || [ -z "$A" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::add-mask::$T"
          echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$A" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.ok == 'true'
        continue-on-error: true
        run: |
          cd api && npm ci --silent
          npx wrangler deploy --config ../site/wrangler.jsonc || { echo "::warning::Chưa đăng được bản web lên Cloudflare Workers (GitHub Pages vẫn đăng bình thường)."; exit 1; }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
