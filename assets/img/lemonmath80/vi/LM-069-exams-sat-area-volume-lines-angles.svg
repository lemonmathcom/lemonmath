<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm69-title lm69-desc"><title id="lm69-title">Khu vườn bị khoét nửa hình tròn</title><desc id="lm69-desc">Hình ghép có phần bị khoét, số đo cạnh và bán kính đúng đề; tô phần diện tích cần tính. Đây là đề hình học yêu cầu học sinh tự dựng hình trước khi tính.</desc><defs><marker id="lm69-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm69-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm69-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm69-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm69-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm69-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Khu vườn bị khoét nửa hình tròn</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Hình chữ nhật 12 m × 8 m; đường kính hồ bằng cạnh 8 m.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="100" y="230" width="600" height="400" rx="0" fill="#E7F4EB" stroke="#167754" stroke-width="3" /><path d="M100,230 A200,200 0 0 1 100,630 Z" fill="#E8F2FB" stroke="#246DA8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="100" y1="430" x2="300" y2="430" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" /><text x="200" y="412" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#246DA8" text-anchor="middle" >r = 4 m</text><line x1="100" y1="230" x2="100" y2="195" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="700" y1="230" x2="700" y2="195" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="100" y1="195" x2="700" y2="195" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm69-muted)" marker-start="url(#lm69-muted)"/><text x="400" y="221" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >12 m</text><line x1="700" y1="230" x2="735" y2="230" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="700" y1="630" x2="735" y2="630" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="735" y1="230" x2="735" y2="630" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm69-muted)" marker-start="url(#lm69-muted)"/><text x="750" y="438" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="start" >8 m</text><text x="980" y="305" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="middle" >Vườn: 96 m²</text><text x="980" y="375" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="middle" >Hồ: 8π m²</text><text x="980" y="445" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="middle" >Lấy phần vườn</text><text x="980" y="515" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="middle" >trừ diện tích hồ</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Diện tích còn lại: 96 − 8π m²</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>