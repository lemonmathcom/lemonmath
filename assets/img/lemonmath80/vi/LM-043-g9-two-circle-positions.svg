<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="lm43-title lm43-desc"><title id="lm43-title">Vị trí tương đối của hai đường tròn</title><desc id="lm43-desc">Bộ năm hình hai đường tròn có tâm khác nhau: ngoài nhau, tiếp xúc ngoài, cắt nhau, tiếp xúc trong, trong nhau; ghi d so với R+r và |R−r|; chú thích riêng trường hợp đồng tâm/trùng nhau. Hình cắt nhau và tiếp xúc ngoài đã có; cần bộ trường hợp để đối chiếu điều kiện.</desc><defs><marker id="lm43-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm43-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm43-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm43-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm43-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm43-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Vị trí tương đối của hai đường tròn</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Ký hiệu d là khoảng cách hai tâm; ở năm hình đầu R &gt; r &gt; 0.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="55" y="150" width="350" height="265" rx="14" fill="#F0F3F1" stroke="none" stroke-width="0" /><text x="75" y="186" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >Ngoài nhau</text><circle cx="145" cy="280" r="60" fill="#FFFFFF" stroke="#167754" stroke-width="3" /><circle cx="265" cy="280" r="36" fill="none" stroke="#246DA8" stroke-width="3" /><line x1="145" y1="280" x2="265" y2="280" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" /><circle cx="145" cy="280" r="4" fill="#167754" stroke="none" stroke-width="0" /><circle cx="265" cy="280" r="4" fill="#246DA8" stroke="none" stroke-width="0" /><text x="230" y="385" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#183B34" text-anchor="middle" >d &gt; R + r</text><rect x="440" y="150" width="350" height="265" rx="14" fill="#F0F3F1" stroke="none" stroke-width="0" /><text x="460" y="186" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >Tiếp xúc ngoài</text><circle cx="530" cy="280" r="60" fill="#FFFFFF" stroke="#167754" stroke-width="3" /><circle cx="626" cy="280" r="36" fill="none" stroke="#246DA8" stroke-width="3" /><line x1="530" y1="280" x2="626" y2="280" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" /><circle cx="530" cy="280" r="4" fill="#167754" stroke="none" stroke-width="0" /><circle cx="626" cy="280" r="4" fill="#246DA8" stroke="none" stroke-width="0" /><text x="615" y="385" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#183B34" text-anchor="middle" >d = R + r</text><rect x="825" y="150" width="350" height="265" rx="14" fill="#F0F3F1" stroke="none" stroke-width="0" /><text x="845" y="186" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >Cắt nhau</text><circle cx="915" cy="280" r="60" fill="#FFFFFF" stroke="#167754" stroke-width="3" /><circle cx="980" cy="280" r="36" fill="none" stroke="#246DA8" stroke-width="3" /><line x1="915" y1="280" x2="980" y2="280" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" /><circle cx="915" cy="280" r="4" fill="#167754" stroke="none" stroke-width="0" /><circle cx="980" cy="280" r="4" fill="#246DA8" stroke="none" stroke-width="0" /><text x="1000" y="385" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#183B34" text-anchor="middle" >R − r &lt; d &lt; R + r</text><rect x="55" y="450" width="350" height="265" rx="14" fill="#F0F3F1" stroke="none" stroke-width="0" /><text x="75" y="486" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >Tiếp xúc trong</text><circle cx="145" cy="580" r="60" fill="#FFFFFF" stroke="#167754" stroke-width="3" /><circle cx="169" cy="580" r="36" fill="none" stroke="#246DA8" stroke-width="3" /><line x1="145" y1="580" x2="169" y2="580" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" /><circle cx="145" cy="580" r="4" fill="#167754" stroke="none" stroke-width="0" /><circle cx="169" cy="580" r="4" fill="#246DA8" stroke="none" stroke-width="0" /><text x="230" y="685" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#183B34" text-anchor="middle" >d = R − r</text><rect x="440" y="450" width="350" height="265" rx="14" fill="#F0F3F1" stroke="none" stroke-width="0" /><text x="460" y="486" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >Trong nhau</text><circle cx="530" cy="580" r="60" fill="#FFFFFF" stroke="#167754" stroke-width="3" /><circle cx="542" cy="580" r="36" fill="none" stroke="#246DA8" stroke-width="3" /><line x1="530" y1="580" x2="542" y2="580" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" /><circle cx="530" cy="580" r="4" fill="#167754" stroke="none" stroke-width="0" /><circle cx="542" cy="580" r="4" fill="#246DA8" stroke="none" stroke-width="0" /><text x="615" y="685" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#183B34" text-anchor="middle" >0 &lt; d &lt; R − r</text><rect x="825" y="450" width="350" height="265" rx="14" fill="#F0F3F1" stroke="none" stroke-width="0" /><text x="845" y="486" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >Trường hợp đặc biệt</text><circle cx="915" cy="580" r="50" fill="#FFFFFF" stroke="#167754" stroke-width="3" /><circle cx="915" cy="580" r="29" fill="none" stroke="#246DA8" stroke-width="3" /><circle cx="1080" cy="580" r="50" fill="none" stroke="#167754" stroke-width="4" /><circle cx="1080" cy="580" r="50" fill="none" stroke="#246DA8" stroke-width="2" stroke-dasharray="7 6"/><text x="915" y="685" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#183B34" text-anchor="middle" >Đồng tâm</text><text x="1080" y="685" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#183B34" text-anchor="middle" >Trùng nhau</text><text x="600" y="833" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >So sánh d với R + r và R − r.</text><text x="1152" y="875" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>