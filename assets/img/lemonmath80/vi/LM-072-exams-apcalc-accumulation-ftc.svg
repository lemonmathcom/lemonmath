<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm72-title lm72-desc"><title id="lm72-title">Xấp xỉ lượng nước bằng bốn hình thang</title><desc id="lm72-desc">Đánh dấu các điểm (0,4), (2,7), (5,9), (7,6), (10,5), nối đoạn thẳng và tô bốn hình thang rộng 2, 3, 2, 3 phút; chú thích diện tích tính bằng lít. Giải thích tổng hình thang với các khoảng không đều; bổ sung cho đồ thị của ví dụ khác đã có.</desc><defs><marker id="lm72-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm72-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm72-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm72-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm72-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm72-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Xấp xỉ lượng nước bằng bốn hình thang</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Các khoảng thời gian không đều: 2, 3, 2, 3 phút.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><line x1="100" y1="215" x2="100" y2="610" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><line x1="100" y1="610" x2="100" y2="617" fill="none" stroke="#5F746C" stroke-width="1.5" stroke-linecap="round"  /><text x="100" y="644" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#5F746C" text-anchor="middle" >0</text><line x1="300" y1="215" x2="300" y2="610" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><line x1="300" y1="610" x2="300" y2="617" fill="none" stroke="#5F746C" stroke-width="1.5" stroke-linecap="round"  /><text x="300" y="644" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#5F746C" text-anchor="middle" >2</text><line x1="600" y1="215" x2="600" y2="610" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><line x1="600" y1="610" x2="600" y2="617" fill="none" stroke="#5F746C" stroke-width="1.5" stroke-linecap="round"  /><text x="600" y="644" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#5F746C" text-anchor="middle" >5</text><line x1="800" y1="215" x2="800" y2="610" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><line x1="800" y1="610" x2="800" y2="617" fill="none" stroke="#5F746C" stroke-width="1.5" stroke-linecap="round"  /><text x="800" y="644" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#5F746C" text-anchor="middle" >7</text><line x1="1100" y1="215" x2="1100" y2="610" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><line x1="1100" y1="610" x2="1100" y2="617" fill="none" stroke="#5F746C" stroke-width="1.5" stroke-linecap="round"  /><text x="1100" y="644" fo