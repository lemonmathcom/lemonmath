5" r="7" fill="#167754" stroke="none" stroke-width="0" /><circle cx="600" cy="254.5" r="7" fill="#167754" stroke="none" stroke-width="0" /><circle cx="800" cy="373" r="7" fill="#167754" stroke="none" stroke-width="0" /><circle cx="1100" cy="412.5" r="7" fill="#167754" stroke="none" stroke-width="0" /><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >11 + 24 + 15 + 16,5 = 66,5 lít</text><text x="48" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5F746C" text-anchor="start" >Đường nối dùng để xấp xỉ, không khẳng định R(t) tuyến tính.</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>