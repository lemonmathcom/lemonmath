<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm58-title lm58-desc"><title id="lm58-title">Khoảng cách giữa AA′ và BD</title><desc id="lm58-desc">Hình lập phương ABCD.A′B′C′D′; tô cạnh AA′, đường chéo BD, mặt phẳng BDD′B′ và đoạn AO vuông góc chung. Một hình khoảng cách từ điểm đến mặt phẳng không thay được hình cho hai đường chéo nhau.</desc><defs><marker id="lm58-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm58-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm58-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm58-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm58-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm58-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Khoảng cách giữa AA′ và BD</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" fo