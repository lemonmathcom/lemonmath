<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="lm61-title lm61-desc"><title id="lm61-title">Có hoàn lại và không hoàn lại</title><desc id="lm61-desc">Hai sơ đồ cây đặt cạnh nhau, giữ nguyên lần rút đầu và làm nổi xác suất nhánh lần hai thay đổi hoặc giữ nguyên. Giải thích trực quan khi nào hai lần rút độc lập.</desc><defs><marker id="lm61-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm61-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm61-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm61-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm61-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm61-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Có hoàn lại và không hoàn lại</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Hộp có 3 thẻ đỏ, 2 thẻ xanh. Đ = đỏ; X = xanh.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><text x="310" y="160" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#167754" text-anchor="middle" >Hoàn lại</text><text x="905" y="160" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#167754" text-anchor="middle" >Không hoàn lại</text><line x1="600" y1="195" x2="600" y2="735" fill="none" stroke="#DBE6E0" stroke-width="2" stroke-linecap="round"  /><circle cx="65" cy="440" r="13" fill="#183B34" stroke="none" stroke-width="0" /><line x1="65" y1="440" x2="245" y2="280" fill="none" stroke="#BC4740" stroke-width="3" stroke-linecap="round"  /><line x1="65" y1="440" x2="245" y2="555" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round"  /><text x="120" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#BC4740" text-anchor="start" >3/5</text><text x="120" y="540" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#246DA8" text-anchor="start" >2/5</text><circle cx="245" cy="280" r="25" fill="#FBEDEA" stroke="#BC4740" stroke-width="2" /><text x="245" y="288" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#BC4740" text-anchor="middle" >Đ</text><circle cx="245" cy="555" r="25" fill="#E8F2FB" stroke="#246DA8" stroke-width="2" /><text x="245" y="563" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#246DA8" text-anchor="middle" >X</text><line x1="245" y1="280" x2="420" y2="190" fill="none" stroke="#BC4740" stroke-width="2" stroke-linecap="round"  /><text x="320" y="225" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#BC4740" text-anchor="middle" >3/5</text><circle cx="420" cy="190" r="7" fill="#BC4740" stroke="none" stroke-width="0" /><text x="440" y="198" font-family="Arial, sans-serif" font-size="23" font-