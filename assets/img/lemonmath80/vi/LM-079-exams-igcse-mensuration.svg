<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="lm79-title lm79-desc"><title id="lm79-title">Thể tích khối ghép: trụ và nửa cầu</title><desc id="lm79-desc">Hình trụ bán kính 3 cm, cao 10 cm, phía trên là nửa hình cầu cùng bán kính; tô hai khối khác màu và ghi kích thước. Giúp phân tích khối ghép và cộng đúng hai thể tích.</desc><defs><marker id="lm79-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm79-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm79-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm79-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm79-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm79-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="970" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Thể tích khối ghép: trụ và nửa cầu</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Hai phần có cùng bán kính 3 cm; phần trụ cao 10 cm.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><path d="M215,365 L215,765 A120,32 0 0 0 455,765 L455,365 Z" fill="#E7F4EB" stroke="#167754" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="335" cy="765" rx="120" ry="32" fill="#E7F4EB" stroke="#167754" stroke-width="3" /><path d="M215,365 A120,120 0 0 1 455,365 A120,32 0 0 1 215,365 Z" fill="#E8F2FB" stroke="#246DA8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="335" cy="365" rx="120" ry="32" fill="none" stroke="#5F746C" stroke-width="2" stroke-dasharray="6 5"/><line x1="335" y1="365" x2="455" y2="365" fill="none" stroke="#B8750C" stroke-width="3" stroke-linecap="round"  /><text x="395" y="345" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#B8750C" text-anchor="middle" >3 cm</text><line x1="215" y1="365" x2="160" y2="365" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="215" y1="765" x2="160" y2="765" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="160" y1="365" x2="160" y2="765" fill="none" stroke="#167754" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm79-green)" marker-start="url(#lm79-green)"/><text x="142" y="573" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#167754" text-anchor="middle" >10 cm</text><text x="850" y="315" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="middle" >Vtrụ = π × 3² × 10 = 90π</text><text x="850" y="405" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="middle" >Vnửa cầu = ½ × 4π × 3³/3</text><text x="850" y="495" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="middle" >= 18π</text><text x="850" y="585" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="middle" >V = 90π + 18π = 108π</text><text x="600" y="903" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >V = 108π ≈ 339,3 cm³</text><text x="1152" y="945" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>