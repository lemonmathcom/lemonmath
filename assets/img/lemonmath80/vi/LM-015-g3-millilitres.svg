<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm15-title lm15-desc"><title id="lm15-title">Đọc bình chia độ và nhiệt kế</title><desc id="lm15-desc">Bình chia độ có vạch ml và nhiệt kế có vạch °C; dùng số đo của các ví dụ trong bài. Học cách đọc dụng cụ đo; hiện phần này chủ yếu mô tả bằng chữ và số.</desc><defs><marker id="lm15-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm15-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm15-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm15-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm15-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm15-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Đọc bình chia độ và nhiệt kế</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Nhìn đúng vạch số và viết đúng đơn vị.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><text x="290" y="160" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#246DA8" text-anchor="middle" >Dung tích</text><rect x="180" y="210" width="220" height="390" rx="18" fill="#FFFFFF" stroke="#246DA8" stroke-width="4" /><rect x="184" y="410" width="212" height="186" rx="0" fill="#C7E5F4" stroke="none" stroke-width="2" /><line x1="185" y1="590" x2="228" y2="590" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round"  /><text x="245" y="598" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#183B34" text-anchor="start" >0 ml</text><line x1="185" y1="500" x2="228" y2="500" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round"  /><text x="245" y="508" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#183B34" text-anchor="start" >250 ml</text><line x1="185" y1="410" x2="228" y2="410" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round"  /><text x="245" y="418" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#183B34" text-anchor="start" >500 ml</text><line x1="185" y1="320" x2="228" y2="320" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round"  /><text x="245" y="328" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#183B34" text-anchor="start" >750 ml</text><line x1="185" y1="230" x2="228" y2="230" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round"  /><text x="245" y="238" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#183B34" text-anchor="start" >1000 ml</text><text x="290" y="660" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#246DA8" text-anchor="middle" >1 l = 1 000 ml</text><text x="850" y="160" font-family="Arial, sans-serif" font-size="29" font-weight=