<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm10-title lm10-desc"><title id="lm10-title">Đổi tiền: giá trị không đổi</title><desc id="lm10-desc">Thẻ tiền giản lược theo đúng mệnh giá của ví dụ; đặt hai nhóm tiền có tổng bằng nhau cạnh nhau. Giúp nhận biết mệnh giá và hiểu đổi tiền mà tổng giá trị giữ nguyên.</desc><defs><marker id="lm10-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm10-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm10-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm10-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm10-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm10-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Đổi tiền: giá trị không đổi</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Một tờ 10 000 đồng đổi được hai tờ 5 000 đồng.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="90" y="300" width="380" height="210" rx="14" fill="#E7F4EB" stroke="#167754" stroke-width="3" /><rect x="104" y="314" width="352" height="182" rx="9" fill="none" stroke="#B5C8BF" stroke-width="1.5" /><text x="280" y="417" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#167754" text-anchor="middle" >10 000</text><text x="280" y="485" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#5F746C" text-anchor="middle" >đồng</text><text x="575" y="425" font-family="Arial, sans-serif" font-size="52" font-weight="600" fill="#183B34" text-anchor="middle" >=</text><rect x="695" y="205" width="390" height="185" rx="14" fill="#FFF3CB" stroke="#167754" stroke-width="3" /><rect x="709" y="219" width="362" height="157" rx="9" fill="none" stroke="#B5C8BF" stroke-width="1.5" /><text x="890" y="309.5" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#167754" text-anchor="middle" >5 000</text><text x="890" y="365" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#5F746C" text-anchor="middle" >đồng</text><rect x="695" y="450" width="390" height="185" rx="14" fill="#FFF3CB" stroke="#167754" stroke-width="3" /><rect x="709" y="464" width="362" height="157" rx="9" fill="none" stroke="#B5C8BF" stroke-width="1.5" /><text x="890" y="554.5" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#167754" text-anchor="middle" >5 000</text><text x="890" y="610" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#5F746C" text-anchor="middle" >đồng</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >10 000 = 5 000 + 5 000</text><text x="48" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5F746C" text-anchor="start" >Thẻ mệnh giá giản lược phục vụ học tập.</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>