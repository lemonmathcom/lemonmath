<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="lm19-title lm19-desc"><title id="lm19-title">Cộng phân số: vì sao cần quy đồng?</title><desc id="lm19-desc">Băng 1/2 và 1/3 cùng một đơn vị; chia về sáu phần bằng nhau, ghép thành 5/6; kèm băng 1−5/6 ở phần trừ. Hình trực tiếp giải thích nhu cầu quy đồng, giảm lỗi cộng cả hai mẫu.</desc><defs><marker id="lm19-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm19-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm19-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm19-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm19-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm19-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Cộng phân số: vì sao cần quy đồng?</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Đưa 1/2 và 1/3 về các phần cùng kích thước.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="270" y="190" width="120" height="60" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><rect x="390" y="190" width="120" height="60" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><rect x="510" y="190" width="120" height="60" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><rect x="630" y="190" width="120" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="750" y="190" width="120" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="870" y="190" width="120" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><text x="150" y="232" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#246DA8" text-anchor="middle" >1/2 = 3/6</text><rect x="270" y="325" width="120" height="60" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><rect x="390" y="325" width="120" height="60" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><rect x="510" y="325" width="120" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="630" y="325" width="120" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="750" y="325" width="120" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="870" y="325" width="120" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><text x="150" y="367" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#B8750C" text-anchor="middle" >1/3 = 2/6</text><rect x="270" y="510" width="120" height="72" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><rect x="390" y="510" width="120" height="72" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><rect x="510" y="510" width="120" height="72" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><rect x="630" y="510" width="120" height="72" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><rect x="750" y="510" width="120" height="72" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><rect x="870" y="510" width="120" height="72" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><text x="150" y="559" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Tổng</text><text x="630" y="645" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#183B34" text-anchor="middle" >3 phần sáu + 2 phần sáu = 5 phần sáu</text><rect x="450" y="705" width="80" height="46" rx="0" fill="#F0F3F1" stroke="#183B34" stroke-width="1.5" /><rect x="530" y="705" width="80" height="46" rx="0" fill="#F0F3F1" stroke="#183B34" stroke-width="1.5" /><rect x="610" y="705" width="80" height="46" rx="0" fill="#F0F3F1" stroke="#183B34" stroke-width="1.5" /><rect x="690" y="705" width="80" height="46" rx="0" fill="#F0F3F1" stroke="#183B34" stroke-width="1.5" /><rect x="770" y="705" width="80" height="46" rx="0" fill="#F0F3F1" stroke="#183B34" stroke-width="1.5" /><rect x="850" y="705" width="80" height="46" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="850" y="705" width="80" height="46" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><text x="200" y="737" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#167754" text-anchor="start" >Còn lại: 1/6</text><text x="600" y="833" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >1/2 + 1/3 = 5/6  ·  1 − 5/6 = 1/6</text><text x="1152" y="875" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>