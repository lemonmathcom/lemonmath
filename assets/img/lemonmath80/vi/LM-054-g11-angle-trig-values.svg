<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm54-title lm54-desc"><title id="lm54-title">Từ góc quay đến độ cao cabin</title><desc id="lm54-desc">Vòng đu quay có tâm, bán kính, mặt đất, cabin và hình chiếu; ghi góc và độ cao theo đúng ví dụ. Nối góc lượng giác, tọa độ trên đường tròn và đại lượng thực tế.</desc><defs><marker id="lm54-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm54-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm54-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm54-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm54-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm54-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Từ góc quay đến độ cao cabin</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Vòng đu quay bán kính 10 m; tâm cao 12 m so với mặt đất.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><line x1="110" y1="637" x2="1100" y2="637" fill="none" stroke="#5F746C" stroke-width="3" stroke-linecap="round"  /><circle cx="425" cy="385" r="210" fill="#F0F3F1" stroke="#167754" stroke-width="4" /><line x1="425" y1="385" x2="425" y2="637" fill="none" stroke="#5F746C" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="425" y1="385" x2="606.8653347947321" y2="490" fill="none" stroke="#246DA8" stroke-width="4" stroke-linecap="round"  /><path d="M425,450 A65,65 0 0 0 481.29165124598853,417.5" fill="none" stroke="#B8750C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="495" y="475" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#B8750C" text-anchor="middle" >θ</text><circle cx="606.8653347947321" cy="490" r="15" fill="#FFF3CB" stroke="#B8750C" stroke-width="3" /><line x1="606.8653347947321" y1="490" x2="606.8653347947321" y2="637" fill="none" stroke="#BC4740" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" /><line x1="170" y1="637" x2="150" y2="637" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="170" y1="385" x2="150" y2="385" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="150" y1="637" x2="150" y2="385" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm54-muted)" marker-start="url(#lm54-muted)"/><text x="168" y="519" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >12 m</text><text x="636.8653347947321" y="570" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#BC4740" text-anchor="start" >h = 7 m</text><text x="530" y="410" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#246DA8" text-anchor="middle" >10 m</text><text x="425" y="678" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#5F746C" text-anchor="middle" >Mặt đất</text><text x="875" y="265" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#183B34" text-anchor="middle" >θ = π/3</text><text x="875" y="345" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#183B34" text-anchor="middle" >h = 12 − 10 cosθ</text><text x="875" y="425" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#183B34" text-anchor="middle" >= 7 m</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >θ = π ⇒ h = 22 m  ·  θ = 0 ⇒ h = 2 m</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>