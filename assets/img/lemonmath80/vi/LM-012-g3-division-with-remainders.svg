<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm12-title lm12-desc"><title id="lm12-title">23 : 5 — chia được mấy nhóm đầy?</title><desc id="lm12-desc">23 chấm được khoanh thành bốn nhóm 5 chấm, còn 3 chấm ngoài nhóm; ghi rõ phần dư. Phân biệt số nhóm, số phần tử mỗi nhóm và số dư.</desc><defs><marker id="lm12-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm12-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm12-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm12-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm12-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm12-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >23 : 5 — chia được mấy nhóm đầy?</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Mỗi nhóm có đúng 5 chấm; số dư phải bé hơn 5.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="100" y="230" width="180" height="205" rx="20" fill="#E7F4EB" stroke="#167754" stroke-width="2" /><circle cx="142" cy="285" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="197" cy="285" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="142" cy="340" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="197" cy="340" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="142" cy="395" r="16" fill="#167754" stroke="none" stroke-width="0" /><text x="190" y="490" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#167754" text-anchor="middle" >Nhóm 1</text><rect x="330" y="230" width="180" height="205" rx="20" fill="#E7F4EB" stroke="#167754" stroke-width="2" /><circle cx="372" cy="285" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="427" cy="285" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="372" cy="340" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="427" cy="340" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="372" cy="395" r="16" fill="#167754" stroke="none" stroke-width="0" /><text x="420" y="490" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#167754" text-anchor="middle" >Nhóm 2</text><rect x="560" y="230" width="180" height="205" rx="20" fill="#E7F4EB" stroke="#167754" stroke-width="2" /><circle cx="602" cy="285" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="657" cy="285" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="602" cy="340" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="657" cy="340" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="602" cy="395" r="16" fill="#167754" stroke="none" stroke-width="0" /><text x="650" y="490" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#167754" text-anchor="middle" >Nhóm 3</text><rect x="790" y="230" width="180" height="205" rx="20" fill="#E7F4EB" stroke="#167754" stroke-width="2" /><circle cx="832" cy="285" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="887" cy="285" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="832" cy="340" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="887" cy="340" r="16" fill="#167754" stroke="none" stroke-width="0" /><circle cx="832" cy="395" r="16" fill="#167754" stroke="none" stroke-width="0" /><text x="880" y="490" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#167754" text-anchor="middle" >Nhóm 4</text><rect x="425" y="545" width="350" height="98" rx="14" fill="#FFF3CB" stroke="none" stroke-width="0" /><text x="445" y="581" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >Còn dư 3 chấm</text><circle cx="660" cy="591" r="11" fill="#B8750C" stroke="none" stroke-width="0" /><circle cx="694" cy="591" r="11" fill="#B8750C" stroke="none" stroke-width="0" /><circle cx="728" cy="591" r="11" fill="#B8750C" stroke="none" stroke-width="0" /><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >23 = 5 × 4 + 3  ⇒  23 : 5 = 4 (dư 3)</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>