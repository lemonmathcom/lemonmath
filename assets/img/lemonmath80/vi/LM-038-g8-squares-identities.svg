<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="lm38-title lm38-desc"><title id="lm38-title">Hằng đẳng thức qua diện tích</title><desc id="lm38-desc">Hình vuông cạnh a+b chia bốn phần a², ab, ab, b²; hình thứ hai minh hoạ cắt ghép hiệu hai bình phương. Làm rõ nguồn gốc hạng tử 2ab và ý nghĩa hai hằng đẳng thức.</desc><defs><marker id="lm38-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm38-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm38-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm38-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm38-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm38-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="1080" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Hằng đẳng thức qua diện tích</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Các độ dài trong hình: a &gt; b &gt; 0.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="95" y="190" width="210" height="210" rx="0" fill="#E7F4EB" stroke="#167754" stroke-width="2" /><rect x="305" y="190" width="95" height="210" rx="0" fill="#E8F2FB" stroke="#246DA8" stroke-width="2" /><rect x="95" y="400" width="210" height="95" rx="0" fill="#E8F2FB" stroke="#246DA8" stroke-width="2" /><rect x="305" y="400" width="95" height="95" rx="0" fill="#FFF3CB" stroke="#B8750C" stroke-width="2" /><text x="200" y="303" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#167754" text-anchor="middle" >a²</text><text x="352.5" y="303" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#246DA8" text-anchor="middle" >ab</text><text x="200" y="456.5" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#246DA8" text-anchor="middle" >ab</text><text x="352.5" y="455.5" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#B8750C" text-anchor="middle" >b²</text><line x1="95" y1="190" x2="95" y2="163" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="305" y1="190" x2="305" y2="163" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="95" y1="163" x2="305" y2="163" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm38-muted)" marker-start="url(#lm38-muted)"/><text x="200" y="189" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >a</text><line x1="305" y1="190" x2="305" y2="163" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="400" y1="190" x2="400" y2="163" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="305" y1="163" x2="400" y2="163" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm38-muted)" marker-start="url(#lm38-muted)"/><text x="352.5" y="189" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >b</text><text x="715" y="290" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#167754" text-anchor="middle" >(a + b)²</text><text x="715" y="360" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#167754" text-anchor="middle" >a² + ab + ab + b²</text><text x="715" y="430" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#167754" text-anchor="middle" >= a² + 2ab + b²</text><rect x="100" y="690" width="210" height="140" rx="0" fill="#E8F2FB" stroke="#246DA8" stroke-width="2" /><rect x="100" y="830" width="140" height="70" rx="0" fill="#E7F4EB" stroke="#167754" stroke-width="2" /><rect x="240" y="830" width="70" height="70" rx="0" fill="#FFFFFF" stroke="#BC4740" stroke-width="2" stroke-dasharray="6 5"/><text x="275" y="873" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#BC4740" text-anchor="middle" >b²</text><text x="205" y="650" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#183B34" text-anchor="middle" >a² − b²</text><line x1="420" y1="790" x2="565" y2="790" fill="none" stroke="#5F746C" stroke-width="4" stroke-linecap="round"  marker-end="url(#lm38-muted)" /><rect x="675" y="690" width="210" height="140" rx="0" fill="#E8F2FB" stroke="#246DA8" stroke-width="2" /><rect x="885" y="690" width="70" height="140" rx="0" fill="#E7F4EB" stroke="#167754" stroke-width="2" /><line x1="675" y1="690" x2="675" y2="662" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="955" y1="690" x2="955" y2="662" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="675" y1="662" x2="955" y2="662" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm38-muted)" marker-start="url(#lm38-muted)"/><text x="815" y="688" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >a + b</text><text x="1000" y="775" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#183B34" text-anchor="start" >a − b</text><text x="600" y="1013" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >a² − b² = (a + b)(a − b)</text><text x="1152" y="1055" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>