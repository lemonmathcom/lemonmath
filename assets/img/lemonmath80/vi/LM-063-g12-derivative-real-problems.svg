<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="lm63-title lm63-desc"><title id="lm63-title">Thùng không nắp: tôn nằm ở những mặt nào?</title><desc id="lm63-desc">Thùng không nắp, đáy cạnh x và chiều cao theo thể tích; hình khai triển cho thấy một đáy và bốn mặt bên. Giải thích các hạng tử trong hàm diện tích cần tối ưu trước khi dùng đạo hàm.</desc><defs><marker id="lm63-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm63-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm63-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm63-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm63-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm63-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="940" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Thùng không nắp: tôn nằm ở những mặt nào?</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Đáy vuông cạnh x, chiều cao h; thể tích cố định 32 dm³.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><polygon points="120,620 420,620 564,530 264,530" fill="#FFF3CB" stroke="#183B34" stroke-width="2" stroke-linejoin="round" /><polygon points="264,530 564,530 564,365 264,365" fill="#F0F3F1" stroke="#183B34" stroke-width="2" stroke-linejoin="round" /><polygon points="120,620 264,530 264,365 120,455" fill="#E8F2FB" stroke="#183B34" stroke-width="2" stroke-linejoin="round" /><polygon points="120,620 420,620 420,455 120,455" fill="#E7F4EB" stroke="#183B34" stroke-width="2" stroke-linejoin="round" /><polygon points="420,620 564,530 564,365 420,455" fill="#E8F2FB" stroke="#183B34" stroke-width="2" stroke-linejoin="round" /><line x1="120" y1="455" x2="420" y2="455" fill="none" stroke="#167754" stroke-width="4" stroke-linecap="round"  /><line x1="420" y1="455" x2="564" y2="365" fill="none" stroke="#167754" stroke-width="4" stroke-linecap="round"  /><line x1="564" y1="365" x2="264" y2="365" fill="none" stroke="#167754" stroke-width="4" stroke-linecap="round"  /><line x1="264" y1="365" x2="120" y2="455" fill="none" stroke="#167754" stroke-width="4" stroke-linecap="round"  /><line x1="120" y1="620" x2="120" y2="658" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="420" y1="620" x2="420" y2="658" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="120" y1="658" x2="420" y2="658" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm63-muted)" marker-start="url(#lm63-muted)"/><text x="270" y="684" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >x</text><line x1="420" y1="620" x2="435.8999682000954" y2="645.4399491201526" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="564" y1="530" x2="579.8999682000954" y2="555.4399491201526" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="435.8999682000954" y1="645.4399491201526" x2="579.8999682000954" y2="555.4399491201526" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm63-muted)" marker-start="url(#lm63-muted)"/><text x="517.4399491201526" y="623.7039185922442" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >x</text><text x="100" y="515" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#183B34" text-anchor="start" >h</text><text x="350" y="250" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >Không có mặt nắp</text><rect x="825" y="420" width="160" height="160" rx="0" fill="#FFF3CB" stroke="#183B34" stroke-width="2" /><rect x="825" y="338" width="160" height="82" rx="0" fill="#E7F4EB" stroke="#183B34" stroke-width="2" /><rect x="825" y="580" width="160" height="82" rx="0" fill="#E7F4EB" stroke="#183B34" stroke-width="2" /><rect x="743" y="420" width="82" height="160" rx="0" fill="#E7F4EB" stroke="#183B34" stroke-width="2" /><rect x="985" y="420" width="82" height="160" rx="0" fill="#E7F4EB" stroke="#183B34" stroke-width="2" /><text x="905" y="510" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#B8750C" text-anchor="middle" >x²</text><text x="905" y="388" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >xh</text><text x="905" y="630" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >xh</text><text x="784" y="509" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >xh</text><text x="1026" y="509" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >xh</text><text x="905" y="250" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#183B34" text-anchor="middle" >x²h = 32</text><text x="905" y="740" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#167754" text-anchor="middle" >1 đáy + 4 mặt bên</text><text x="600" y="873" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >S = x² + 4xh = x² + 128/x</text><text x="1152" y="915" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>