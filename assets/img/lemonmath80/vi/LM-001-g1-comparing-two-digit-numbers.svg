<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm1-title lm1-desc"><title id="lm1-title">So sánh 35 và 42</title><desc id="lm1-desc">Hai nhóm khối chục–đơn vị biểu diễn 35 và 42; đặt cạnh bảng hàng chục, hàng đơn vị. Giúp trẻ nhìn thấy vì sao phải so sánh hàng chục trước.</desc><defs><marker id="lm1-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm1-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm1-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm1-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm1-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm1-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >So sánh 35 và 42</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >So sánh hàng chục trước, rồi mới đến hàng đơn vị.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="65" y="150" width="505" height="440" rx="14" fill="#E7F4EB" stroke="none" stroke-width="0" /><text x="85" y="186" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >35 = 3 chục + 5 đơn vị</text><rect x="630" y="150" width="505" height="440" rx="14" fill="#E8F2FB" stroke="none" stroke-width="0" /><text x="650" y="186" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >42 = 4 chục + 2 đơn vị</text><rect x="150" y="260" width="20" height="150" rx="0" fill="#E7F4EB" stroke="#167754" stroke-width="2" /><line x1="150" y1="275" x2="170" y2="275" fill="none" stroke="#167754" stroke-width="1" stroke-linecap="round"  /><line x1="150" y1="290" x2="170" y2="290" fill="none" stroke="#167754" stroke-width="1" stroke-linecap="round"  /><line x1="150" y1="305" x2="170" y2="305" fill="none" stroke="#167754" stroke-width="1" stroke-linecap="round"  /><line x1="150" y1="320" x2="170" y2="320" fill="none" stroke="#167754" stroke-width="1" stroke-linecap="round"  /><line x1="150" y1="335" x2="170" y2="335" fill="none" stroke="#167754" stroke-width="1" stroke-linecap="round"  /><line x1="150" y1="350" x2="170" y2="350" fill="none" stroke="#167754" stroke-width="1" stroke-linecap="round"  /><line x1="150" y1="365" x2="170" y2="365" fill="none" stroke="#167754" stroke-width="1" stroke-linecap="round"  /><line x1="150" y1="380" x2="170" y2="380" fill="none" stroke="#167754" stroke-width="1" stroke-linecap="round"  /><line x1="150" y1="395" x2="170" y2="395" fill="none" stroke="#167754" stroke-width="1" stroke-linecap="round"  /><rect x="181" y="260" width="20" height="150" rx="0" fill="#E7F4EB" stroke="#167754" stroke-width="2" /><line x1="181" y1="275" x2="201" y2="275" fill="none" stroke="#167754" stroke-width="1" stroke-linecap="round"  /><li