<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm48-title lm48-desc"><title id="lm48-title">Hệ thức trọng tâm bằng hình bình hành</title><desc id="lm48-desc">Tam giác ABC, trung tuyến AM, trọng tâm G; thêm D sao cho M là trung điểm GD và hình bình hành GBDC như lời giải; tô GD đối với GA. Hình các quy tắc tổng/hiệu đã có nhưng chưa minh họa riêng hệ thức trọng tâm và điểm phụ.</desc><defs><marker id="lm48-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm48-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm48-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm48-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm48-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm48-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Hệ thức trọng tâm bằng hình bình hành</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >M là trung điểm của BC và GD; G là trọng tâm tam giác ABC.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><polygon points="360,155 120,515 600,515" fill="#E7F4EB" stroke="#167754" stroke-width="2" stroke-linejoin="round" /><polygon points="360,395 120,515 360,635 600,515" fill="#E8F2FB" stroke="#246DA8" stroke-width="2" stroke-linejoin="round" /><line x1="360" y1="155" x2="360" y2="635" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" /><line x1="360" y1="395" x2="120" y2="515" fill="none" stroke="#246DA8" stroke-width="4" stroke-linecap="round"  marker-end="url(#lm48-blue)" /><line x1="360" y1="395" x2="600" y2="515" fill="none" stroke="#246DA8" stroke-width="4" stroke-linecap="round"  marker-end="url(#lm48-blue)" /><line x1="360" y1="395" x2="360" y2="635" fill="none" stroke="#167754" stroke-width="5" stroke-linecap="round"  marker-end="url(#lm48-green)" /><line x1="360" y1="395" x2="360" y2="155" fill="none" stroke="#BC4740" stroke-width="5" stroke-linecap="round"  marker-end="url(#lm48-red)" /><text x="360" y="137" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor="middle" >A</text><text x="100" y="540" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor="middle" >B</text><text x="620" y="540" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor="middle" >C</text><text x="380" y="505" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor="middle" >M</text><text x="337" y="395" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor="middle" >G</text><text x="360" y="670" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor="middle" >D</text><text x="809.83" y="300" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor="middle" >GB</text><line x1="794.98" y1="269" x2="824.6800000000001" y2="269" fill="none" stroke="#183B34" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm48-ink)" /><text x="854.915" y="300" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183B34" text-anchor="middle" >+</text><text x="900" y="300" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor="middle" >GC</text><line x1="885.15" y1="269" x2="914.85" y2="269" fill="none" stroke="#183B34" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm48-ink)" /><text x="945.085" y="300" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183B34" text-anchor="middle" >=</text><text x="990.1700000000001" y="300" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#167754" text-anchor="middle" >GD</text><line x1="975.32" y1="269" x2="1005.0200000000001" y2="269" fill="none" stroke="#167754" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm48-green)" /><text x="838.66" y="460" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >GD</text><line x1="823.26" y1="428" x2="854.06" y2="428" fill="none" stroke="#167754" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm48-green)" /><text x="900" y="460" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="middle" >= −</text><text x="961.34" y="460" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#BC4740" text-anchor="middle" >GA</text><line x1="945.94" y1="428" x2="976.74" y2="428" fill="none" stroke="#BC4740" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm48-red)" /><text x="900" y="590" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor