<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm41-title lm41-desc"><title id="lm41-title">Lập phương trình cho chuyến đi và về</title><desc id="lm41-desc">Trục đường A–B, mũi tên các chặng và dòng thời gian; gắn quãng đường, vận tốc, thời gian theo đúng bài. Giúp thiết lập phương trình từ quan hệ các chặng đi.</desc><defs><marker id="lm41-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm41-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm41-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm41-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm41-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm41-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Lập phương trình cho chuyến đi và về</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Đi 50 km/h, về 40 km/h; thời gian về nhiều hơn 30 phút.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><circle cx="180" cy="290" r="12" fill="#167754" stroke="none" stroke-width="0" /><circle cx="1020" cy="290" r="12" fill="#167754" stroke="none" stroke-width="0" /><line x1="210" y1="290" x2="985" y2="290" fill="none" stroke="#167754" stroke-width="6" stroke-linecap="round"  marker-end="url(#lm41-green)" /><text x="180" y="240" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#183B34" text-anchor="middle" >A</text><text x="1020" y="240" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#183B34" text-anchor="middle" >B</text><text x="600" y="230" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#167754" text-anchor="middle" >Lượt đi: 50 km/h</text><text x="600" y="350" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >Thời gian: x giờ</text><line x1="985" y1="495" x2="210" y2="495" fill="none" stroke="#246DA8" stroke-width="6" stroke-linecap="round"  marker-end="url(#lm41-blue)" /><text x="600" y="440" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#246DA8" text-anchor="middle" >Lượt về: 40 km/h</text><text x="600" y="555" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#246DA8" text-anchor="middle" >Thời gian: x + 0,5 giờ</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Cùng quãng đường AB: 50x = 40(x + 0,5)</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>