<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm21-title lm21-desc"><title id="lm21-title">Trung bình cộng là chia đều</title><desc id="lm21-desc">Ba cột khối cao 4, 6, 8; chuyển khối từ cột cao sang cột thấp để thành ba cột 6. Giải thích trung bình cộng như chia đều, bổ sung cho trục số đã có.</desc><defs><marker id="lm21-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm21-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm21-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm21-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm21-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm21-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Trung bình cộng là chia đều</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Giữ nguyên tổng 18 khối khi chuyển từ cột cao sang cột thấp.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="100" y="567" width="75" height="43" rx="0" fill="#E7F4EB" stroke="#183B34" stroke-width="1.5" /><rect x="100" y="524" width="75" height="43" rx="0" fill="#E7F4EB" stroke="#183B34" stroke-width="1.5" /><rect x="100" y="481" width="75" height="43" rx="0" fill="#E7F4EB" stroke="#183B34" stroke-width="1.5" /><rect x="100" y="438" width="75" height="43" rx="0" fill="#E7F4EB" stroke="#183B34" stroke-width="1.5" /><text x="137" y="655" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >4</text><rect x="225" y="567" width="75" height="43" rx="0" fill="#E8F2FB" stroke="#183B34" stroke-width="1.5" /><rect x="225" y="524" width="75" height="43" rx="0" fill="#E8F2FB" stroke="#183B34" stroke-width="1.5" /><rect x="225" y="481" width="75" height="43" rx="0" fill="#E8F2FB" stroke="#183B34" stroke-width="1.5" /><rect x="225" y="438" width="75" height="43" rx="0" fill="#E8F2FB" stroke="#183B34" stroke-width="1.5" /><rect x="225" y="395" width="75" height="43" rx="0" fill="#E8F2FB" stroke="#183B34" stroke-width="1.5" /><rect x="225" y="352" width="75" height="43" rx="0" fill="#E8F2FB" stroke="#183B34" stroke-width="1.5" /><text x="262" y="655" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >6</text><rect x="350" y="567" width="75" height="43" rx="0" fill="#E7F4EB" stroke="#183B34" stroke-width="1.5" /><rect x="350" y="524" width="75" height="43" rx="0" fill="#E7F4EB" stroke="#183B34" stroke-width="1.5" /><rect x="350" y="481" width="75" height="43" rx="0" fill="#E7F4EB" stroke="#183B34" stroke-width="1.5" /><rect x="350" y="438" width="75" height="43" rx="0" fill="#E7F4EB" stroke="#183B34" stroke-width="1.5" /><rect x="350" y="395" width="75" height="43" rx="0" fill="#E7F4EB" stroke