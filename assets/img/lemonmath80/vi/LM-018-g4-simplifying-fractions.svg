<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="lm18-title lm18-desc"><title id="lm18-title">Rút gọn và quy đồng mẫu số</title><desc id="lm18-desc">Hai băng giấy cùng độ dài: chia nhỏ rồi gộp các ô thành nhóm; thêm cặp băng giấy quy đồng theo đúng ví dụ. Làm rõ rút gọn và quy đồng chỉ đổi cách chia, không đổi lượng.</desc><defs><marker id="lm18-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm18-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm18-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm18-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm18-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm18-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Rút gọn và quy đồng mẫu số</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Đổi cách chia phần, giữ nguyên lượng đã tô.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><text x="75" y="160" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#183B34" text-anchor="start" >Rút gọn: gộp mỗi 3 ô nhỏ</text><rect x="260" y="195" width="60" height="60" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="320" y="195" width="60" height="60" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="380" y="195" width="60" height="60" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="440" y="195" width="60" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="500" y="195" width="60" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="560" y="195" width="60" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="620" y="195" width="60" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="680" y="195" width="60" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="740" y="195" width="60" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="800" y="195" width="60" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="860" y="195" width="60" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="920" y="195" width="60" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="260" y="310" width="180" height="60" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="440" y="310" width="180" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="620" y="310" width="180" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="800" y="310" width="180" height="60" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><text x="160" y="237" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >3/12</text><text x="160" y="352" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >1/4</text><line x1="1000" y1="215" x2="1000" y2="350" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm18-muted)" /><text x="1040" y="293" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#5F746C" text-anchor="start" >: 3</text><text x="75" y="465" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#183B34" text-anchor="start" >Quy đồng: chia về phần sáu</text><rect x="260" y="510" width="120" height="58" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><rect x="380" y="510" width="120" height="58" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><rect x="500" y="510" width="120" height="58" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><rect x="620" y="510" width="120" height="58" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="740" y="510" width="120" height="58" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="860" y="510" width="120" height="58" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><text x="150" y="552" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#246DA8" text-anchor="middle" >1/2 = 3/6</text><rect x="260" y="640" width="120" height="58" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><rect x="380" y="640" width="120" height="58" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><rect x="500" y="640" width="120" height="58" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="620" y="640" width="120" height="58" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="740" y="640" width="120" height="58" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="860" y="640" width="120" height="58" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><text x="150" y="682" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#B8750C" text-anchor="middle" >1/3 = 2/6</text><text x="600" y="833" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Các băng giấy luôn có cùng một độ dài.</text><text x="1152" y="875" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>