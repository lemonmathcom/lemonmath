<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm17-title lm17-desc"><title id="lm17-title">Hai phân số, cùng một lượng</title><desc id="lm17-desc">Hai băng giấy cùng độ dài: một băng tô 2/3, băng kia chia đôi từng phần ba để được 4/6 nhưng giữ nguyên lượng tô. Tia số đã có cho biết các phân số bằng nhau; băng giấy giải thích vì sao.</desc><defs><marker id="lm17-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm17-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm17-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm17-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm17-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm17-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Hai phân số, cùng một lượng</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Chia nhỏ mỗi phần ba thành hai phần: lượng tô không đổi.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="200" y="245" width="260" height="100" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="460" y="245" width="260" height="100" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="720" y="245" width="260" height="100" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="200" y="460" width="130" height="100" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="330" y="460" width="130" height="100" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="460" y="460" width="130" height="100" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="590" y="460" width="130" height="100" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="720" y="460" width="130" height="100" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><rect x="850" y="460" width="130" height="100" rx="0" fill="#FFFFFF" stroke="#183B34" stroke-width="1.5" /><text x="100" y="310" font-family="Arial, sans-serif" font-size="35" font-weight="600" fill="#167754" text-anchor="middle" >2/3</text><text x="100" y="525" font-family="Arial, sans-serif" font-size="35" font-weight="600" fill="#167754" text-anchor="middle" >4/6</text><line x1="330" y1="365" x2="330" y2="430" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm17-muted)" /><line x1="590" y1="365" x2="590" y2="430" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm17-muted)" /><line x1="850" y1="365" x2="850" y2="430" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm17-muted)" /><text x="600" y="185" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#183B34" text-anchor="middle" >Hai băng giấy bằng nhau</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >2/3 = (2 × 2)/(3 × 2) = 4/6</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>