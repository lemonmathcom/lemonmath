<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm34-title lm34-desc"><title id="lm34-title">Trộn vữa theo tỉ lệ 2 : 7</title><desc id="lm34-desc">Các khối đơn vị bằng nhau cho các thành phần hỗn hợp, kèm bảng tỉ lệ và mũi tên cùng nhân một hệ số. Diễn giải dãy tỉ số bằng nhau qua mô hình chia phần.</desc><defs><marker id="lm34-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm34-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm34-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm34-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm34-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm34-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Trộn vữa theo tỉ lệ 2 : 7</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Biết có 63 bao cát; mỗi phần ứng với cùng một số bao.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><text x="90" y="275" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="start" >Xi măng</text><rect x="330" y="235" width="105" height="75" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><rect x="435" y="235" width="105" height="75" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><text x="435" y="355" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#246DA8" text-anchor="middle" >2 phần</text><text x="90" y="485" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="start" >Cát</text><rect x="330" y="445" width="105" height="75" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><rect x="435" y="445" width="105" height="75" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><rect x="540" y="445" width="105" height="75" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><rect x="645" y="445" width="105" height="75" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><rect x="750" y="445" width="105" height="75" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><rect x="855" y="445" width="105" height="75" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><rect x="960" y="445" width="105" height="75" rx="0" fill="#B8750C" stroke="#183B34" stroke-width="1.5" /><text x="698" y="595" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#B8750C" text-anchor="middle" >7 phần = 63 bao</text><rect x="690" y="215" width="370" height="44" rx="10" fill="#FFF3CB" stroke="none" stroke-width="0" /><text x="875" y="245" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#B8750C" text-anchor="middle" >63 : 7 = 9 bao / phần</text><rect x="690" y="305" width="370" height="44" rx="10" fill="#E8F2FB" stroke="none" stroke-width="0" /><text x="875" y="335" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#246DA8" text-anchor="middle" >2 × 9 = 18 bao xi măng</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >18 : 63 = 2 : 7</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>