<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm76-title lm76-desc"><title id="lm76-title">Ba căn bậc ba của 8i trên mặt phẳng Argand</title><desc id="lm76-desc">Mặt phẳng Argand, đường tròn và các nghiệm cách đều góc theo đúng ví dụ; gắn dạng cực và dạng đại số. Cho thấy cấu trúc hình học của các nghiệm phức.</desc><defs><marker id="lm76-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm76-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm76-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm76-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm76-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm76-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Ba căn bậc ba của 8i trên mặt phẳng Argand</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Các nghiệm có môđun 2 và cách nhau một góc 120°.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><line x1="145" y1="687.5" x2="145" y2="162.5" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><line x1="92.5" y1="635" x2="617.5" y2="635" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><text x="145" y="452" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#5F746C" text-anchor="middle" >-2</text><text x="343" y="643" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#5F746C" text-anchor="end" >-2</text><line x1="250" y1="687.5" x2="250" y2="162.5" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><line x1="92.5" y1="530" x2="617.5" y2="530" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><text x="250" y="452" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#5F746C" text-anchor="middle" >-1</text><text x="343" y="538" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#5F746C" text-anchor="end" >-1</text><line x1="355" y1="687.5" x2="355" y2="162.5" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><line x1="92.5" y1="425" x2="617.5" y2="425" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><line x1="460" y1="687.5" x2="460" y2="162.5" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><line x1="92.5" y1="320" x2="617.5" y2="320" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><text x="460" y="452" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#5F746C" text-anchor="middle" >1</text><text x="343" y="328" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#5F746C" text-anchor="end" >1</text><line x1="565" y1="687.5" x2="565" y2="162.5" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><line x1="92.5" y1="215" x2="617.5" y2="215" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><text x="565" y="452" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#5F746C" text-anchor="middle" >2</text><text x="343" y="223" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#5F746C" text-anchor="end" >2</text><line x1="92.5" y1="425" x2="649" y2="425" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm76-muted)" /><line x1="355" y1="687.5" x2="355" y2="141.5" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm76-muted)" /><text x="650" y="433" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#183B34" text-anchor="start" >Re z</text><text x="370" y="145" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#183B34" text-anchor="start" >Im z</text><circle cx="355" cy="425" r="210" fill="none" stroke="#167754" stroke-width="3" stroke-dasharray="8 6"/><line x1="355" y1="425" x2="536.8653347947321" y2="320" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round"  /><circle cx="536.8653347947321" cy="320" r="10" fill="#246DA8" stroke="none" stroke-width="0" /><line x1="355" y1="425" x2="173.1346652052679" y2="320" fill="none" stroke="#167754" stroke-width="3" stroke-linecap="round"  /><circle cx="173.1346652052679" cy="320" r="10" fill="#167754" stroke="none" stroke-width="0" /><line x1="355" y1="425" x2="355" y2="635" fill="none" stroke="#B8750C" stroke-width="3" stroke-linecap="round"  /><circle cx="355" cy="635" r="10" fill="#B8750C" stroke="none" stroke-width="0" /><text x="590" y="285" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#246DA8" text-anchor="middle" >√3 + i</text><text x="140" y="285" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >−√3 + i</text><text x="355" y="680" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#B8750C" text-anchor="middle" >−2i</text><path d="M437.2724133595217,377.5 A95,95 0 0 0 272.72758664047836,377.5" fill="none" stroke="#5F746C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M272.72758664047836,377.5 A95,95 0 0 0 355,520" fill="none" stroke="#5F746C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M355,520 A95,95 0 0 0 437.2724133595217,377.5" fill="none" stroke="#5F746C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="435" y="500" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#5F746C" text-anchor="middle" >120°</text><text x="965" y="255" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183B34" text-anchor="middle" >z³ = 8i</text><text x="965" y="330" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183B34" text-anchor="middle" >z = 2(cosθ + i sinθ)</text><text x="965" y="405" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183B34" text-anchor="middle" >θ = π/6 + 2kπ/3</text><text x="965" y="480" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183B34" text-anchor="middle" >k = 0, 1, 2</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >z = √3 + i;  −√3 + i;  −2i</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>