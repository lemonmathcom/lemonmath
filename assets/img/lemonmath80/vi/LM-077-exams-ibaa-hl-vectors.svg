<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="lm77-title lm77-desc"><title id="lm77-title">Hai đường thẳng chéo nhau trong không gian</title><desc id="lm77-desc">Hai đường thẳng trong không gian và các vectơ chỉ phương; thêm hình chiếu giải thích giao nhau trên bản vẽ chưa chắc cắt nhau trong không gian. Tránh diễn giải hình phẳng sai khi giải hệ tham số.</desc><defs><marker id="lm77-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm77-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm77-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm77-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm77-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm77-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="930" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Hai đường thẳng chéo nhau trong không gian</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Giao nhau trên hình chiếu Oxy chưa đủ để có điểm chung trong không gian.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><line x1="205" y1="490" x2="589.8" y2="412" fill="none" stroke="#246DA8" stroke-width="5" stroke-linecap="round"  /><line x1="285.6" y1="707.75" x2="410.40000000000003" y2="369.75" fill="none" stroke="#167754" stroke-width="5" stroke-linecap="round"  /><line x1="301.2" y1="470.5" x2="301.2" y2="665.5" fill="none" stroke="#BC4740" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5" /><circle cx="301.2" cy="470.5" r="9" fill="#246DA8" stroke="none" stroke-width="0" /><circle cx="301.2" cy="665.5" r="9" fill="#167754" stroke="none" stroke-width="0" /><text x="286.2" y="450.5" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#246DA8" text-anchor="end" >P: z = 2</text><text x="321.2" y="690.5" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#167754" text-anchor="start" >Q: z = −1</text><text x="425" y="385" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#246DA8" text-anchor="middle" >L₁</text><text x="405" y="560" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >L₂</text><text x="330" y="190" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#183B34" text-anchor="middle" >Trong không gian</text><line x1="735" y1="250" x2="735" y2="700" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-linecap="round"  /><line x1="735" y1="700" x2="735" y2="707" fill="none" stroke="#5F746C" stroke-width="1.5" stroke-linecap="round"  /><text x="735" y="734" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#5F746C" text-anchor="middle" >0</text><line x1="807" y1="250" x2="807" y2="700" fill="none" stroke="#DBE6E0" stroke-width="1" stroke-