<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm66-title lm66-desc"><title id="lm66-title">So sánh khoảng tứ phân vị của hai lớp</title><desc id="lm66-desc">Hai dải từ Q1 đến Q3 trên cùng trục thời gian; ghi các tứ phân vị ước lượng của lớp 12A, 12B và chiều dài khoảng tứ phân vị. Nhìn trực tiếp độ rộng xấp xỉ 50% số liệu ở giữa; không suy diễn giá trị nhỏ nhất/lớn nhất chính xác từ bảng ghép nhóm.</desc><defs><marker id="lm66-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm66-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm66-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm66-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm66-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm66-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >So sánh khoảng tứ phân vị của hai lớp</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Các tứ phân vị là giá trị ước lượng từ mẫu ghép nhóm.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><line x1="200" y1="635" x2="200" y2="642" fill="none" stroke="#5F746C" stroke-width="1.5" stroke-linecap="round"  /><text x="200" y="669" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#5F746C" text-anchor="middle" >0</text><line x1="380" y1="635" x2="380" y2="642" fill="none" stroke="#5F746C" stroke-width="1.5" stroke-linecap="round"  /><text x="380" y="669" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#5F746C" text-anchor="middle" >10</text><line x1="560" y1="635" x2="560" y2="642" fill="none" stroke="#5F746C" stroke-width="1.5" stroke-linecap="round"  /><text x="560" y="669" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#5F746C" text-anchor="middle" >20</text><line x1="740" y1="635" x2="740" y2="642" fill="none" stroke="#5F746C" stroke-width="1.5" stroke-linecap="round"  /><text x="740" y="669" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#5F746C" text-anchor="middle" >30</text><line x1="920" y1="635" x2="920" y2="642" fill="none" stroke="#5F746C" stroke-width="1.5" stroke-linecap="round"  /><text x="920" y="669" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#5F746C" text-anchor="middle" >40</text><line x1="1100" y1="635" x2="1100" y2="642" fill="none" stroke="#5F746C" stroke-width="1.5" stroke-linecap="round"  /><text x="1100" y="669" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#5F746C" text-anchor="middle" >50</text><line x1="200" y1="635" x2="1112" y2="635" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm66-muted)" /><line x1="200" y1="635" x2="200" y2="218" fill="none" str