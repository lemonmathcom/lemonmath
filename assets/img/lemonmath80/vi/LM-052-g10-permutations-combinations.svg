<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="lm52-title lm52-desc"><title id="lm52-title">Có thứ tự hay không có thứ tự?</title><desc id="lm52-desc">Cùng ba thẻ người được đặt vào ba bục có thứ tự; so sánh với chọn một nhóm ba người không có chức danh. Phân biệt chỉnh hợp với tổ hợp bằng việc đổi chỗ có tạo kết quả mới hay không.</desc><defs><marker id="lm52-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm52-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm52-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm52-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm52-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm52-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="920" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Có thứ tự hay không có thứ tự?</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Cùng ba người A, B, C: đổi vị trí giải thưởng tạo kết quả khác.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="95" y="290" width="120" height="140" rx="6" fill="#E7F4EB" stroke="#183B34" stroke-width="2" /><text x="155" y="250" font-family="Arial, sans-serif" font-size="39" font-weight="600" fill="#167754" text-anchor="middle" >A</text><text x="155" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#183B34" text-anchor="middle" >Nhất</text><rect x="240" y="340" width="120" height="90" rx="6" fill="#E8F2FB" stroke="#183B34" stroke-width="2" /><text x="300" y="300" font-family="Arial, sans-serif" font-size="39" font-weight="600" fill="#246DA8" text-anchor="middle" >B</text><text x="300" y="390" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#183B34" text-anchor="middle" >Nhì</text><rect x="385" y="380" width="120" height="50" rx="6" fill="#FFF3CB" stroke="#183B34" stroke-width="2" /><text x="445" y="340" font-family="Arial, sans-serif" font-size="39" font-weight="600" fill="#B8750C" text-anchor="middle" >C</text><text x="445" y="430" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#183B34" text-anchor="middle" >Ba</text><rect x="695" y="290" width="120" height="140" rx="6" fill="#E7F4EB" stroke="#183B34" stroke-width="2" /><text x="755" y="250" font-family="Arial, sans-serif" font-size="39" font-weight="600" fill="#167754" text-anchor="middle" >B</text><text x="755" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#183B34" text-anchor="middle" >Nhất</text><rect x="840" y="340" width="120" height="90" rx="6" fill="#E8F2FB" stroke="#183B34" stroke-width="2" /><text x="900" y="300" font-family="Arial, sans-serif" font-size="39" font-weight="600" fill="#246DA8" text-anchor="middle" >A</text><text x="900" y="390" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#183B34" text-anchor="middle" >Nhì</text><rect x="985" y="380" width="120" height="50" rx="6" fill="#FFF3CB" stroke="#183B34" stroke-width="2" /><text x="1045" y="340" font-family="Arial, sans-serif" font-size="39" font-weight="600" fill="#B8750C" text-anchor="middle" >C</text><text x="1045" y="430" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#183B34" text-anchor="middle" >Ba</text><text x="600" y="350" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#BC4740" text-anchor="middle" >≠</text><text x="600" y="535" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#183B34" text-anchor="middle" >Chỉnh hợp: phân biệt thứ tự</text><rect x="295" y="595" width="610" height="44" rx="10" fill="#F0F3F1" stroke="none" stroke-width="0" /><text x="600" y="625" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#183B34" text-anchor="middle" >Chọn nhóm: {A; B; C} = {B; A; C}</text><text x="600" y="853" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >A₁₀³ = 10 × 9 × 8 = 720  ·  C₁₀³ = 720/6 = 120</text><text x="1152" y="895" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>