<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm71-title lm71-desc"><title id="lm71-title">Related rates: chiếc thang đang trượt</title><desc id="lm71-desc">Thang, tường, sàn, các biến x(t), y(t), chiều dài cố định và mũi tên vận tốc hai đầu. Hình là bước thiết lập quan hệ trước khi lấy đạo hàm theo thời gian.</desc><defs><marker id="lm71-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm71-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm71-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm71-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm71-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm71-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Related rates: chiếc thang đang trượt</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Thang dài 5 m; chân trượt ra 0,6 m/s. Xét lúc x = 3 m.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="145" y="170" width="55" height="465" rx="0" fill="#F0F3F1" stroke="none" stroke-width="2" /><line x1="90" y1="635" x2="1100" y2="635" fill="none" stroke="#5F746C" stroke-width="3" stroke-linecap="round"  /><polygon points="200,635 500,635 200,235" fill="#E8F2FB" stroke="none" stroke-width="3" stroke-linejoin="round" /><line x1="200" y1="235" x2="500" y2="635" fill="none" stroke="#B8750C" stroke-width="7" stroke-linecap="round"  /><line x1="200" y1="635" x2="500" y2="635" fill="none" stroke="#167754" stroke-width="3" stroke-linecap="round"  /><line x1="200" y1="235" x2="200" y2="635" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round"  /><path d="M200,610 L225,610 L225,635" fill="none" stroke="#183B34" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="360" y="420" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#B8750C" text-anchor="start" >5 m</text><text x="350" y="685" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >x = 3 m</text><text x="90" y="425" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#246DA8" text-anchor="start" >y = 4 m</text><line x1="515" y1="590" x2="650" y2="590" fill="none" stroke="#167754" stroke-width="4" stroke-linecap="round"  marker-end="url(#lm71-green)" /><text x="620" y="545" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#167754" text-anchor="middle" >dx/dt = 0,6 m/s</text><line x1="245" y1="245" x2="245" y2="350" fill="none" stroke="#BC4740" stroke-width="4" stroke-linecap="round"  marker-end="url(#lm71-red)" /><text x="280" y="270" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#BC4740" text-anchor="start" >dy/dt &lt; 0</text><text x="920" y="325" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#183B34" text-anchor="middle" >x² + y² = 25</text><text x="920" y="410" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#183B34" text-anchor="middle" >2x dx/dt + 2y dy/dt = 0</text><text x="920" y="495" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#183B34" text-anchor="middle" >dy/dt = −0,45 m/s</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Đầu thang đang trượt xuống với tốc độ 0,45 m/s.</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>