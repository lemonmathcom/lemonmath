<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm33-title lm33-desc"><title id="lm33-title">Cùng giảm 60 nghìn, phần trăm có bằng nhau?</title><desc id="lm33-desc">Hai nhãn giá 240 nghìn giảm 25% và 280 nghìn giảm 60 nghìn; mỗi thanh biểu diễn 100% giá gốc của chính cửa hàng đó, ghi cả số tiền và phần trăm giảm. Cho thấy cùng giảm 60 nghìn nhưng tỉ lệ giảm và giá cuối khác nhau do giá gốc khác nhau.</desc><defs><marker id="lm33-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm33-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm33-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm33-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm33-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm33-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Cùng giảm 60 nghìn, phần trăm có bằng nhau?</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Mỗi thanh biểu diễn 100% giá gốc của chính cửa hàng đó.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><text x="100" y="200" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="start" >Cửa hàng 1: giá gốc 240 nghìn</text><rect x="120" y="240" width="960" height="75" rx="0" fill="#E7F4EB" stroke="#167754" stroke-width="2" /><rect x="120" y="240" width="240" height="75" rx="0" fill="#FFF3CB" stroke="#B8750C" stroke-width="2" /><text x="240" y="289" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#B8750C" text-anchor="middle" >25%</text><text x="700" y="289" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Còn 180 nghìn</text><text x="235" y="365" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#B8750C" text-anchor="middle" >Giảm 60 nghìn</text><text x="100" y="445" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="start" >Cửa hàng 2: giá gốc 280 nghìn</text><rect x="120" y="485" width="960" height="75" rx="0" fill="#E8F2FB" stroke="#246DA8" stroke-width="2" /><rect x="120" y="485" width="205.71428571428572" height="75" rx="0" fill="#FFF3CB" stroke="#B8750C" stroke-width="2" /><text x="225" y="534" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#B8750C" text-anchor="middle" >≈ 21,43%</text><text x="700" y="534" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#246DA8" text-anchor="middle" >Còn 220 nghìn</text><text x="235" y="610" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#B8750C" text-anchor="middle" >Giảm 60 nghìn</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >25% &gt; 21,43%  ·  180 nghìn &lt; 220 nghìn</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>