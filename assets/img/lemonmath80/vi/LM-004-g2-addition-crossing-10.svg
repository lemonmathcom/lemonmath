<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm4-title lm4-desc"><title id="lm4-title">Gộp cho đủ 10: 8 + 5</title><desc id="lm4-desc">Khung mười ô cho phép cộng 8+5: chuyển 2 chấm sang làm đầy 10, còn 3 chấm; trình bày ba bước. Giải thích việc tách số để làm tròn chục bên cạnh tia số đã có.</desc><defs><marker id="lm4-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm4-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm4-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm4-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm4-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm4-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Gộp cho đủ 10: 8 + 5</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Chuyển 2 cái kẹo sang hộp để làm đầy 10 ô.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="70" y="165" width="310" height="470" rx="14" fill="#F0F3F1" stroke="none" stroke-width="0" /><text x="90" y="201" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >1. Có 8 và thêm 5</text><rect x="445" y="165" width="310" height="470" rx="14" fill="#F0F3F1" stroke="none" stroke-width="0" /><text x="465" y="201" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >2. Chuyển 2 sang hộp</text><rect x="820" y="165" width="310" height="470" rx="14" fill="#F0F3F1" stroke="none" stroke-width="0" /><text x="840" y="201" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >3. Đủ 10, còn 3</text><rect x="105" y="270" width="46" height="46" rx="0" fill="#FFFFFF" stroke="#B5C8BF" stroke-width="1.3" /><rect x="151" y="270" width="46" height="46" rx="0" fill="#FFFFFF" stroke="#B5C8BF" stroke-width="1.3" /><rect x="197" y="270" width="46" height="46" rx="0" fill="#FFFFFF" stroke="#B5C8BF" stroke-width="1.3" /><rect x="243" y="270" width="46" height="46" rx="0" fill="#FFFFFF" stroke="#B5C8BF" stroke-width="1.3" /><rect x="289" y="270" width="46" height="46" rx="0" fill="#FFFFFF" stroke="#B5C8BF" stroke-width="1.3" /><rect x="105" y="316" width="46" height="46" rx="0" fill="#FFFFFF" stroke="#B5C8BF" stroke-width="1.3" /><rect x="151" y="316" width="46" height="46" rx="0" fill="#FFFFFF" stroke="#B5C8BF" stroke-width="1.3" /><rect x="197" y="316" width="46" height="46" rx="0" fill="#FFFFFF" stroke="#B5C8BF" stroke-width="1.3" /><rect x="243" y="316" width="46" height="46" rx="0" fill="#FFFFFF" stroke="#B5C8BF" stroke-width="1.3" /><rect x="289" y="316" width="46" height="46" rx="0" fill="#FFFFFF" stroke="#B5C8BF" stroke-width="1.3" /><circle cx="128" cy="293" r="12.420000000