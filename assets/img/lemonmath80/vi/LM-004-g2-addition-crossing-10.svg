ont-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#167754" text-anchor="middle" >10 + 3 = 13</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >8 + 5 = 8 + 2 + 3 = 10 + 3 = 13</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>