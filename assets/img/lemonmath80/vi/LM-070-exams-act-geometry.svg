<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm70-title lm70-desc"><title id="lm70-title">Đo chiều cao cây bằng bóng nắng</title><desc id="lm70-desc">Người/vật và bóng trên cùng mặt đất, các tia nắng song song; tô hai tam giác tương ứng. Làm rõ mô hình đồng dạng trong câu hỏi ACT.</desc><defs><marker id="lm70-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm70-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm70-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm70-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm70-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm70-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Đo chiều cao cây bằng bóng nắng</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Cùng thời điểm: người cao 1,6 m có bóng 2 m; cây có bóng 15 m.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><line x1="60" y1="630" x2="1140" y2="630" fill="none" stroke="#5F746C" stroke-width="3" stroke-linecap="round"  /><polygon points="490,630 490,150 1090,630" fill="#E7F4EB" stroke="none" stroke-width="3" stroke-linejoin="round" /><polygon points="120,630 120,566 200,630" fill="#E8F2FB" stroke="none" stroke-width="3" stroke-linejoin="round" /><line x1="490" y1="150" x2="1090" y2="630" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" /><line x1="120" y1="566" x2="200" y2="630" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" /><rect x="480" y="400" width="20" height="230" rx="0" fill="#FFF3CB" stroke="#B8750C" stroke-width="2" /><polygon points="490,150 400,380 445,380 370,510 610,510 535,380 580,380" fill="#E7F4EB" stroke="#167754" stroke-width="3" stroke-linejoin="round" /><circle cx="120" cy="576" r="9" fill="#FFF3CB" stroke="#B8750C" stroke-width="2" /><line x1="120" y1="586" x2="120" y2="608" fill="none" stroke="#183B34" stroke-width="4" stroke-linecap="round"  /><line x1="120" y1="608" x2="110" y2="630" fill="none" stroke="#183B34" stroke-width="3" stroke-linecap="round"  /><line x1="120" y1="608" x2="130" y2="630" fill="none" stroke="#183B34" stroke-width="3" stroke-linecap="round"  /><line x1="120" y1="630" x2="120" y2="658" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="200" y1="630" x2="200" y2="658" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="120" y1="658" x2="200" y2="658" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm70-muted)" marker-start="url(#lm70-muted)"/><text x="160" y="684" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >2 m</text><line x1="490" y1="630" x2="490" y2="658" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="1090" y1="630" x2="1090" y2="658" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="490" y1="658" x2="1090" y2="658" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm70-muted)" marker-start="url(#lm70-muted)"/><text x="790" y="684" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >15 m</text><text x="65" y="560" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#183B34" text-anchor="start" >1,6 m</text><text x="385" y="375" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#167754" text-anchor="start" >h</text><text x="900" y="230" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#246DA8" text-anchor="middle" >Tia nắng song song</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >h/15 = 1,6/2  ⇒  h = 12 m</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>