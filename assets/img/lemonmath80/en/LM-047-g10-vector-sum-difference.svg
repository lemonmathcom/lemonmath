<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm47-title lm47-desc"><title id="lm47-title">Vector sums and differences in a rectangle</title><desc id="lm47-desc">Vector sums and differences in a rectangle. AB = 6, AD = 8. The diagonals have equal lengths but different directions.</desc><defs><marker id="lm47-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm47-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm47-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm47-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm47-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm47-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Vector sums and differences in a rectangle</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >AB = 6, AD = 8. The diagonals have equal lengths but different directions.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><polygon points="200,615 500,615 500,215 200,215" fill="#F0F3F1" stroke="#183B34" stroke-width="2" stroke-linejoin="round" /><line x1="200" y1="615" x2="500" y2="615" fill="none" stroke="#183B34" stroke-width="3" stroke-linecap="round"  marker-end="url(#lm47-ink)" /><line x1="200" y1="615" x2="200" y2="215" fill="none" stroke="#183B34" stroke-width="3" stroke-linecap="round"  marker-end="url(#lm47-ink)" /><line x1="200" y1="615" x2="500" y2="215" fill="none" stroke="#167754" stroke-width="6" stroke-linecap="round"  marker-end="url(#lm47-green)" /><line x1="200" y1="215" x2="500" y2="615" fill="none" stroke="#246DA8" stroke-width="6" stroke-linecap="round"  marker-end="url(#lm47-blue)" /><text x="180" y="643" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor="middle" >A</text><text x="520" y="643" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor="middle" >B</text><text x="520" y="205" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor="middle" >C</text><text x="180" y="205" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#183B34" text-anchor="middle" >D</text><line x1="200" y1="615" x2="200" y2="650" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="500" y1="615" x2="500" y2="650" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="200" y1="650" x2="500" y2="650" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm47-muted)" marker-start="url(#lm47-muted)"/><text x="350" y="676" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >6</text><text x="135" y="420" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="middle" >8</text><text x="773.12" y="335" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#183B34" text-anchor="middle" >AB</text><line x1="757.72" y1="303" x2="788.52" y2="303" fill="none" stroke="#183B34" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm47-ink)" /><text x="819.0600000000001" y="335" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="middle" >+</text><text x="865" y="335" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#183B34" text-anchor="middle" >AD</text><line x1="849.6" y1="303" x2="880.4" y2="303" fill="none" stroke="#183B34" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm47-ink)" /><text x="910.94" y="335" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="middle" >=</text><text x="956.88" y="335" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >AC</text><line x1="941.48" y1="303" x2="972.28" y2="303" fill="none" stroke="#167754" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm47-green)" /><text x="773.12" y="505" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#183B34" text-anchor="middle" >AB</text><line x1="757.72" y1="473" x2="788.52" y2="473" fill="none" stroke="#183B34" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm47-ink)" /><text x="819.0600000000001" y="505" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="middle" >−</text><text x="865" y="505" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#183B34" text-anchor="middle" >AD</text><line x1="849.6" y1="473" x2="880.4" y2="473" fill="none" stroke="#183B34" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm47-ink)" /><text x="910.94" y="505" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="middle" >=</text><text x="956.88" y="505" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#246DA8" text-anchor="middle" >DB</text><line x1="941.48" y1="473" x2="972.28" y2="473" fill="none" stroke="#246DA8" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm47-blue)" /><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >AC = DB = √(6² + 8²) = 10</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>