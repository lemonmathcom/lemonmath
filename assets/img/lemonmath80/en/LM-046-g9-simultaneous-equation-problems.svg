<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm46-title lm46-desc"><title id="lm46-title">A boat travelling downstream and upstream</title><desc id="lm46-desc">A boat travelling downstream and upstream. Both trips are 48 km: 2 hours downstream, 3 hours upstream.</desc><defs><marker id="lm46-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm46-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm46-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm46-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm46-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm46-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >A boat travelling downstream and upstream</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Both trips are 48 km: 2 hours downstream, 3 hours upstream.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="70" y="210" width="1060" height="385" rx="22" fill="#E8F2FB" stroke="none" stroke-width="0" /><line x1="160" y1="260" x2="350" y2="260" fill="none" stroke="#246DA8" stroke-width="4" stroke-linecap="round"  marker-end="url(#lm46-blue)" /><text x="390" y="269" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#246DA8" text-anchor="start" >Current: y km/h</text><polygon points="205,355 335,355 314,387 234,387" fill="#FFFFFF" stroke="#183B34" stroke-width="2" stroke-linejoin="round" /><rect x="250" y="320" width="45" height="35" rx="5" fill="#FFF3CB" stroke="#B8750C" stroke-width="2" /><line x1="345" y1="415" x2="570" y2="415" fill="none" stroke="#167754" stroke-width="5" stroke-linecap="round"  marker-end="url(#lm46-green)" /><polygon points="855,505 985,505 964,537 884,537" fill="#FFFFFF" stroke="#183B34" stroke-width="2" stroke-linejoin="round" /><rect x="900" y="470" width="45" height="35" rx="5" fill="#FFF3CB" stroke="#B8750C" stroke-width="2" /><line x1="845" y1="565" x2="620" y2="565" fill="none" stroke="#167754" stroke-width="5" stroke-linecap="round"  marker-end="url(#lm46-green)" /><text x="610" y="360" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Downstream: x + y = 24</text><text x="610" y="405" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#183B34" text-anchor="middle" >48 : 2 = 24 km/h</text><text x="480" y="520" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Upstream: x − y = 16</text><text x="480" y="565" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#183B34" text-anchor="middle" >48 : 3 = 16 km/h</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Boat: x = 20 km/h  ·  Current: y = 4 km/h</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>