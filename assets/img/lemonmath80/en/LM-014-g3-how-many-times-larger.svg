<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm14-title lm14-desc"><title id="lm14-title">How much longer? How many times as long?</title><desc id="lm14-desc">How much longer? How many times as long?. The blue string is 6 m; the red string is 24 m.</desc><defs><marker id="lm14-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm14-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm14-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm14-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm14-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm14-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >How much longer? How many times as long?</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >The blue string is 6 m; the red string is 24 m.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><text x="85" y="240" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#246DA8" text-anchor="start" >Blue string</text><rect x="300" y="200" width="190" height="52" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><text x="395" y="280" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#246DA8" text-anchor="middle" >6 m</text><text x="85" y="415" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#BC4740" text-anchor="start" >Red string</text><rect x="300" y="370" width="190" height="52" rx="0" fill="#BC4740" stroke="#183B34" stroke-width="1.5" /><rect x="490" y="370" width="190" height="52" rx="0" fill="#BC4740" stroke="#183B34" stroke-width="1.5" /><rect x="680" y="370" width="190" height="52" rx="0" fill="#BC4740" stroke="#183B34" stroke-width="1.5" /><rect x="870" y="370" width="190" height="52" rx="0" fill="#BC4740" stroke="#183B34" stroke-width="1.5" /><text x="395" y="450" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#BC4740" text-anchor="middle" >6 m</text><text x="585" y="450" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#BC4740" text-anchor="middle" >6 m</text><text x="775" y="450" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#BC4740" text-anchor="middle" >6 m</text><text x="965" y="450" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#BC4740" text-anchor="middle" >6 m</text><line x1="490" y1="370" x2="490" y2="325" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="1060" y1="370" x2="1060" y2="325" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="490" y1="325" x2="1060" y2="325" fill="none" stroke="#B8750C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm14-amber)" marker-start="url(#lm14-amber)"/><text x="775" y="351" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#B8750C" text-anchor="middle" >18 m longer</text><text x="600" y="570" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#183B34" text-anchor="middle" >24 m contains four lengths of 6 m.</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >24 − 6 = 18 m longer  ·  24 ÷ 6 = 4 times as long</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>