<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm35-title lm35-desc"><title id="lm35-title">Balancing a triangular card at its centroid</title><desc id="lm35-desc">Balancing a triangular card at its centroid. An isosceles triangle has base 10 cm and median AM = 12 cm.</desc><defs><marker id="lm35-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm35-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm35-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm35-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm35-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm35-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Balancing a triangular card at its centroid</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >An isosceles triangle has base 10 cm and median AM = 12 cm.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><polygon points="365,180 215,540 515,540" fill="#E7F4EB" stroke="#167754" stroke-width="3" stroke-linejoin="round" /><line x1="365" y1="180" x2="365" y2="540" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round"  /><circle cx="365" cy="420" r="9" fill="#BC4740" stroke="none" stroke-width="0" /><text x="365" y="150" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >A</text><text x="195" y="570" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183B34" text-anchor="start" >B</text><text x="530" y="570" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183B34" text-anchor="start" >C</text><text x="383" y="570" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#183B34" text-anchor="start" >M</text><text x="385" y="420" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#BC4740" text-anchor="start" >G</text><line x1="215" y1="540" x2="215" y2="590" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="515" y1="540" x2="515" y2="590" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="215" y1="590" x2="515" y2="590" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm35-muted)" marker-start="url(#lm35-muted)"/><text x="365" y="616" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >10 cm</text><line x1="365" y1="180" x2="310" y2="180" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="365" y1="420" x2="310" y2="420" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="310" y1="180" x2="310" y2="420" fill="none" stroke="#246DA8" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm35-blue)" marker-start="url(#lm35-blue)"/><text x="292" y="308" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#246DA8" text-anchor="middle" >8 cm</text><line x1="365" y1="420" x2="310" y2="420" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="365" y1="540" x2="310" y2="540" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="310" y1="420" x2="310" y2="540" fill="none" stroke="#167754" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm35-green)" marker-start="url(#lm35-green)"/><text x="292" y="488" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#167754" text-anchor="middle" >4 cm</text><line x1="865" y1="375" x2="410" y2="417" fill="none" stroke="#BC4740" stroke-width="3" stroke-linecap="round"  marker-end="url(#lm35-red)" /><text x="870" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="middle" >Balance on your finger at G</text><text x="870" y="440" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="middle" >AG : GM = 2 : 1</text><text x="870" y="550" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >G is 4 cm from BC</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >GM = AM/3 = 12/3 = 4 cm</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>