<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm16-title lm16-desc"><title id="lm16-title">A two-step problem: chickens and ducks</title><desc id="lm16-desc">A two-step problem: chickens and ducks. Lan has 8 chickens and three times as many ducks.</desc><defs><marker id="lm16-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm16-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm16-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm16-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm16-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm16-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >A two-step problem: chickens and ducks</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Lan has 8 chickens and three times as many ducks.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><text x="95" y="245" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#183B34" text-anchor="start" >Chickens</text><rect x="300" y="210" width="220" height="52" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><text x="410" y="285" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#246DA8" text-anchor="middle" >8 birds</text><text x="95" y="420" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#183B34" text-anchor="start" >Ducks</text><rect x="300" y="385" width="220" height="52" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="520" y="385" width="220" height="52" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="740" y="385" width="220" height="52" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><text x="410" y="460" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >8 birds</text><text x="630" y="460" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >8 birds</text><text x="850" y="460" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >8 birds</text><line x1="990" y1="210" x2="1030" y2="210" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="990" y1="437" x2="1030" y2="437" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="1030" y1="210" x2="1030" y2="437" fill="none" stroke="#B8750C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm16-amber)" marker-start="url(#lm16-amber)"/><text x="1012" y="331.5" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#B8750C" text-anchor="middle" >Total?</text><rect x="150" y="565" width="385" height="44" rx="10" fill="#E7F4EB" stroke="none" stroke-width="0" /><text x="342.5" y="595" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#167754" text-anchor="middle" >Step 1: 8 × 3 = 24 ducks</text><rect x="600" y="565" width="450" height="44" rx="10" fill="#E7F4EB" stroke="none" stroke-width="0" /><text x="825" y="595" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#167754" text-anchor="middle" >Step 2: 8 + 24 = 32 birds</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Find the missing amount first, then find the total.</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>