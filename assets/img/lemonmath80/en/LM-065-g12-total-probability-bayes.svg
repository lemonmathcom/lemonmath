<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="lm65-title lm65-desc"><title id="lm65-title">Bayes with 10 000 hypothetical people</title><desc id="lm65-desc">Bayes with 10 000 hypothetical people. Prevalence 1%; test positive: 95% with disease, 5% without disease.</desc><defs><marker id="lm65-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm65-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm65-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm65-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm65-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm65-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="940" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Bayes with 10 000 hypothetical people</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Prevalence 1%; test positive: 95% with disease, 5% without disease.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="55" y="365" width="230" height="105" rx="12" fill="#F0F3F1" stroke="#B5C8BF" stroke-width="1.5" /><text x="170" y="426.5" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="middle" >10 000 people</text><rect x="425" y="220" width="245" height="100" rx="12" fill="#E7F4EB" stroke="#B5C8BF" stroke-width="1.5" /><text x="547.5" y="279" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#167754" text-anchor="middle" >100 with disease</text><rect x="425" y="515" width="245" height="100" rx="12" fill="#E8F2FB" stroke="#B5C8BF" stroke-width="1.5" /><text x="547.5" y="574" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#246DA8" text-anchor="middle" >9 900 without disease</text><rect x="850" y="145" width="285" height="95" rx="12" fill="#E7F4EB" stroke="#B5C8BF" stroke-width="1.5" /><text x="992.5" y="201.5" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#167754" text-anchor="middle" >95 test positive</text><rect x="850" y="300" width="285" height="95" rx="12" fill="#F0F3F1" stroke="#B5C8BF" stroke-width="1.5" /><text x="992.5" y="356.5" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#5F746C" text-anchor="middle" >5 test negative</text><rect x="850" y="475" width="285" height="95" rx="12" fill="#FFF3CB" stroke="#B5C8BF" stroke-width="1.5" /><text x="992.5" y="531.5" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#B8750C" text-anchor="middle" >495 test positive</text><rect x="850" y="630" width="285" height="95" rx="12" fill="#F0F3F1" stroke="#B5C8BF" stroke-width="1.5" /><text x="992.5" y="686.5" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#5F746C" text-anchor="middle" >9 405 test negative</text><line x1="285" y1="415" x2="425" y2="270" fill="none" stroke="#167754" stroke-width="3" stroke-linecap="round"  marker-end="url(#lm65-green)" /><line x1="285" y1="415" x2="425" y2="565" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round"  marker-end="url(#lm65-blue)" /><text x="325" y="310" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#167754" text-anchor="middle" >1%</text><text x="325" y="550" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#246DA8" text-anchor="middle" >99%</text><line x1="670" y1="270" x2="850" y2="192" fill="none" stroke="#167754" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm65-green)" /><text x="760" y="217" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#167754" text-anchor="middle" >95%</text><line x1="670" y1="270" x2="850" y2="347" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm65-muted)" /><text x="760" y="294.5" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#5F746C" text-anchor="middle" >5%</text><line x1="670" y1="565" x2="850" y2="522" fill="none" stroke="#B8750C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm65-amber)" /><text x="760" y="529.5" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#B8750C" text-anchor="middle" >5%</text><line x1="670" y1="565" x2="850" y2="677" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm65-muted)" /><text x="760" y="607" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#5F746C" text-anchor="middle" >95%</text><text x="600" y="873" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Of 590 positive tests, 95 have the disease: 95/590 ≈ 16.10%</text><text x="48" y="915" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5F746C" text-anchor="start" >Hypothetical problem data, not a personal test result.</text><text x="1152" y="915" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>