<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm68-title lm68-desc"><title id="lm68-title">The shortest cable to a water pipe</title><desc id="lm68-desc">The shortest cable to a water pipe. M(0; 0; 4); the pipe follows d: (x; y; z) = (1 + t; −1 + 2t; 2t).</desc><defs><marker id="lm68-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm68-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm68-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm68-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm68-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm68-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >The shortest cable to a water pipe</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >M(0; 0; 4); the pipe follows d: (x; y; z) = (1 + t; −1 + 2t; 2t).</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><line x1="265" y1="650" x2="565" y2="650" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm68-muted)" /><line x1="265" y1="650" x2="373" y2="582.5" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm68-muted)" /><line x1="265" y1="650" x2="265" y2="275" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm68-muted)" /><text x="582" y="674" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="start" >x</text><text x="390" y="580" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="start" >y</text><text x="245" y="257" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="start" >z</text><line x1="304" y1="672.5" x2="598" y2="282.5" fill="none" stroke="#246DA8" stroke-width="12" stroke-linecap="round"  /><line x1="265" y1="350" x2="451" y2="477.5" fill="none" stroke="#BC4740" stroke-width="5" stroke-linecap="round"  /><path d="M435.328467832077,466.75741746553666 L446.76577974674404,451.5854730889376 L462.437311914667,462.3280556234009" fill="none" stroke="#BC4740" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="265" cy="350" r="9" fill="#BC4740" stroke="none" stroke-width="0" /><circle cx="451" cy="477.5" r="9" fill="#167754" stroke="none" stroke-width="0" /><text x="243" y="338" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#BC4740" text-anchor="end" >M</text><text x="473" y="492.5" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#167754" text-anchor="start" >H</text><text x="628" y="282.5" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#246DA8" text-anchor="start" >d</text><text x="910" y="280" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#183B34" text-anchor="middle" >H(2; 1; 2)</text><text x="910" y="370" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#183B34" text-anchor="middle" >MH ⟂ d</text><text x="910" y="460" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#183B34" text-anchor="middle" >MH = 3 m</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >The perpendicular foot gives the shortest cable.</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>