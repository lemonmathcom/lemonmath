<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm59-title lm59-desc"><title id="lm59-title">The angle between a ladder and the ground</title><desc id="lm59-desc">The angle between a ladder and the ground. The ladder is 4 m long; its foot is 1.5 m from the wall.</desc><defs><marker id="lm59-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm59-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm59-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm59-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm59-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm59-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >The angle between a ladder and the ground</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >The ladder is 4 m long; its foot is 1.5 m from the wall.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="220" y="165" width="70" height="460" rx="0" fill="#F0F3F1" stroke="none" stroke-width="2" /><line x1="120" y1="625" x2="1100" y2="625" fill="none" stroke="#5F746C" stroke-width="3" stroke-linecap="round"  /><polygon points="290,625 440,625 290,254.19007564521684" fill="#E8F2FB" stroke="none" stroke-width="3" stroke-linejoin="round" /><line x1="290" y1="254.19007564521684" x2="440" y2="625" fill="none" stroke="#B8750C" stroke-width="7" stroke-linecap="round"  /><line x1="290" y1="625" x2="440" y2="625" fill="none" stroke="#167754" stroke-width="5" stroke-linecap="round"  /><line x1="290" y1="254.19007564521684" x2="290" y2="625" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" /><path d="M290,605 L310,605 L310,625" fill="none" stroke="#183B34" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M380,625 A60,60 0 0 1 417.5,569.3785113467825" fill="none" stroke="#B8750C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="365" y="585" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#B8750C" text-anchor="start" >φ</text><text x="270" y="665" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >H</text><text x="465" y="665" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >A</text><text x="270" y="234.19007564521684" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >S</text><text x="405" y="410" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#B8750C" text-anchor="start" >4 m</text><text x="365" y="665" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >1.5 m</text><text x="850" y="275" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="middle" >AH is the projection of SA</text><text x="850" y="355" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="middle" >The required angle is angle SAH</text><text x="850" y="435" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="middle" >cosφ = 1.5/4</text><text x="850" y="515" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#183B34" text-anchor="middle" >φ ≈ 68.0°</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >The angle with a plane is the angle with the orthogonal projection.</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>