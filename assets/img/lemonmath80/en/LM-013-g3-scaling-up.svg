<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm13-title lm13-desc"><title id="lm13-title">Scaling up and scaling down</title><desc id="lm13-desc">Scaling up and scaling down. Equal parts help us see multiplication and division.</desc><defs><marker id="lm13-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm13-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm13-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm13-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm13-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm13-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Scaling up and scaling down</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Equal parts help us see multiplication and division.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><text x="90" y="165" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="start" >Multiply 4 by 3</text><rect x="260" y="210" width="210" height="52" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><text x="365" y="285" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >4</text><rect x="260" y="335" width="210" height="52" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><rect x="470" y="335" width="210" height="52" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><rect x="680" y="335" width="210" height="52" rx="0" fill="#246DA8" stroke="#183B34" stroke-width="1.5" /><text x="365" y="410" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#246DA8" text-anchor="middle" >4</text><text x="575" y="410" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#246DA8" text-anchor="middle" >4</text><text x="785" y="410" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#246DA8" text-anchor="middle" >4</text><text x="1020" y="370" font-family="Arial, sans-serif" font-size="33" font-weight="600" fill="#246DA8" text-anchor="middle" >12</text><text x="90" y="490" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#183B34" text-anchor="start" >Divide 12 by 3</text><rect x="450" y="535" width="180" height="52" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="630" y="535" width="180" height="52" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><rect x="810" y="535" width="180" height="52" rx="0" fill="#167754" stroke="#183B34" stroke-width="1.5" /><text x="540" y="620" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >4</text><text x="720" y="620" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >4</text><text x="900" y="620" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >4</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >4 × 3 = 12  ·  12 : 3 = 4</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>