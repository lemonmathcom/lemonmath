ltitudes.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><polygon points="240,590 240,185 820,590" fill="#F0F3F1" stroke="#183B34" stroke-width="3" stroke-linejoin="round" /><line x1="240" y1="590" x2="240" y2="185" fill="none" stroke="#167754" stroke-width="6" stroke-linecap="round"  /><line x1="240" y1="590" x2="820" y2="590" fill="none" stroke="#246DA8" stroke-width="6" stroke-linecap="round"  /><line x1="240" y1="590" x2="430.1074087026028" y2="317.7474146975071" fill="none" stroke="#B8750C" stroke-width="3" stroke-linecap="round"  /><path d="M240,566 L264,566 L264,590" fill="none" stroke="#183B34" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M418.65714417614174,334.145324389723 L402.25923448392587,322.6950598632619 L413.70949901038693,306.29715017104604" fill="none" stroke="#B8750C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="240" cy="590" r="10" fill="#BC4740" stroke="none" stroke-width="0" /><text x="205" y="635" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#BC4740" text-anchor="end" >H = A</text><text x="220" y="155" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >B</text><text x="850" y="615" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >C</text><text x="450.1074087026028" y="302.7474146975071" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#B8750C" text-anchor="middle" >K</text><text x="910" y="260" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="middle" >BA ⟂ AC</text><text x="910" y="333" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="middle" >CA ⟂ AB</text><text x="910" y="406" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#183B34" text-anchor="m