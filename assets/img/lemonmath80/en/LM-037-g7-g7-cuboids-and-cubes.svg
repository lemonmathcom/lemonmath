<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="lm37-title lm37-desc"><title id="lm37-title">A swimming pool with a sloping floor</title><desc id="lm37-desc">A swimming pool with a sloping floor. Length 25 m, width 10 m; depth increases uniformly from 1 m to 2 m.</desc><defs><marker id="lm37-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm37-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm37-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm37-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm37-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm37-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="970" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >A swimming pool with a sloping floor</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Length 25 m, width 10 m; depth increases uniformly from 1 m to 2 m.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><polygon points="130,295 830,295 830,485 130,390" fill="#E8F2FB" stroke="#246DA8" stroke-width="2.5" stroke-linejoin="round" /><polygon points="830,295 960,225 960,415 830,485" fill="#E7F4EB" stroke="#167754" stroke-width="2.5" stroke-linejoin="round" /><polygon points="130,295 830,295 960,225 260,225" fill="#D7EDF8" stroke="#246DA8" stroke-width="2.5" stroke-linejoin="round" /><line x1="130" y1="390" x2="260" y2="320" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" /><line x1="260" y1="320" x2="960" y2="415" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" /><line x1="260" y1="225" x2="260" y2="320" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" /><line x1="130" y1="295" x2="130" y2="267" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="830" y1="295" x2="830" y2="267" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="130" y1="267" x2="830" y2="267" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm37-muted)" marker-start="url(#lm37-muted)"/><text x="480" y="293" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >25 m</text><line x1="830" y1="295" x2="815.7770053089495" y2="268.58586700233474" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="960" y1="225" x2="945.7770053089495" y2="198.58586700233474" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="815.7770053089495" y1="268.58586700233474" x2="945.7770053089495" y2="198.58586700233474" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm37-muted)" marker-start="url(#lm37-muted)"/><text x="889.3108021235798" y="257.4343468009339" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >10 m</text><text x="83" y="365" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="middle" >1 m</text><text x="1005" y="395" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="middle" >2 m</text><text x="600" y="570" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#183B34" text-anchor="middle" >The lengthwise cross-section is a trapezium</text><polygon points="260,625 960,625 960,795 260,710" fill="#E8F2FB" stroke="#246DA8" stroke-width="3" stroke-linejoin="round" /><line x1="260" y1="625" x2="260" y2="601" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="960" y1="625" x2="960" y2="601" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="260" y1="601" x2="960" y2="601" fill="none" stroke="#5F746C" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm37-muted)" marker-start="url(#lm37-muted)"/><text x="610" y="627" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >25 m</text><text x="180" y="690" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#183B34" text-anchor="start" >1 m</text><text x="995" y="730" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#183B34" text-anchor="start" >2 m</text><text x="600" y="903" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >V = (1 + 2) × 25/2 × 10 = 375 m³</text><text x="48" y="945" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5F746C" text-anchor="start" >The depth is exaggerated to show the slope clearly.</text><text x="1152" y="945" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>