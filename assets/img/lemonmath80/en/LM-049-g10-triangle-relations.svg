<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm49-title lm49-desc"><title id="lm49-title">Measuring across a pond with the cosine rule</title><desc id="lm49-desc">Measuring across a pond with the cosine rule. CA = 120 m, CB = 95 m, angle ACB = 70°.</desc><defs><marker id="lm49-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm49-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm49-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm49-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm49-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm49-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >Measuring across a pond with the cosine rule</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >CA = 120 m, CB = 95 m, angle ACB = 70°.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><path d="M390,210 C570,140 780,260 820,400 S740,610 565,560 S385,425 390,210 Z" fill="#E8F2FB" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="625" y="360" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#246DA8" text-anchor="middle" >Pond</text><line x1="175" y1="620" x2="775" y2="620" fill="none" stroke="#167754" stroke-width="4" stroke-linecap="round"  /><line x1="175" y1="620" x2="337.4595680796927" y2="173.64600512669352" fill="none" stroke="#167754" stroke-width="4" stroke-linecap="round"  /><line x1="775" y1="620" x2="337.4595680796927" y2="173.64600512669352" fill="none" stroke="#246DA8" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 7" /><path d="M198.94141003279682,554.2215165449865 A70,70 0 0 1 245,620" fill="none" stroke="#B8750C" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="265" y="580" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#B8750C" text-anchor="middle" >70°</text><text x="155" y="635" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >C</text><text x="800" y="645" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >A</text><text x="337.4595680796927" y="150.64600512669352" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >B</text><line x1="175" y1="620" x2="175" y2="656" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="775" y1="620" x2="775" y2="656" fill="none" stroke="#B5C8BF" stroke-width="1.5" stroke-linecap="round"  /><line x1="175" y1="656" x2="775" y2="656" fill="none" stroke="#167754" stroke-width="2" stroke-linecap="round"  marker-end="url(#lm49-green)" marker-start="url(#lm49-green)"/><text x="475" y="682" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#167754" text-anchor="middle" >120 m</text><text x="165" y="365" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#167754" text-anchor="start" >95 m</text><text x="930" y="400" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#246DA8" text-anchor="middle" >AB = ?</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >AB² = 120² + 95² − 2 × 120 × 95 × cos70°  ⇒  AB ≈ 125 m</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>