oke="#167754" stroke-width="3" /><circle cx="650" cy="385" r="92" fill="none" stroke="#167754" stroke-width="3" /><text x="527" y="395" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >2</text><text x="600" y="371" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >4</text><text x="600" y="413" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >6</text><text x="678" y="395" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >5</text><text x="535" y="270" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#167754" text-anchor="middle" >A</text><text x="665" y="270" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#167754" text-anchor="middle" >B</text><text x="465" y="535" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="start" >1, 3</text><rect x="815" y="215" width="360" height="350" rx="12" fill="#FFFFFF" stroke="#B5C8BF" stroke-width="2" /><text x="995" y="170" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#183B34" text-anchor="middle" >Mutually exclusive</text><circle cx="910" cy="385" r="68" fill="#E7F4EB" stroke="#167754" stroke-width="3" /><circle cx="1080" cy="385" r="68" fill="#E8F2FB" stroke="#246DA8" stroke-width="3" /><text x="910" y="375" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#167754" text-anchor="middle" >1, 2</text><text x="1080" y="375" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#246DA8" text-anchor="middle" >5, 6</text><text x="910" y="280" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#167754" text-anchor="middle" >C</text><text x="1080" y="280" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#246DA8" text-anchor="middle" >D</text><text x="995" y="525" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#5F746C" text-anchor="middle" >3, 4</text><text x="205" y="640" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >4 outcomes</text><text x="600" y="640" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#246DA8" text-anchor="middle" >2 outcomes</text><text x="995" y="640" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#183B34" text-anchor="middle" >C ∩ D = ∅</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Union: in at least one event  ·  Intersection: in both events</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>