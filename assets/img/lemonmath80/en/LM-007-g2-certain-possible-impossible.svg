<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm7-title lm7-desc"><title id="lm7-title">A box containing only 8 yellow balls</title><desc id="lm7-desc">A box containing only 8 yellow balls. Choose one ball at random from this box.</desc><defs><marker id="lm7-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm7-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm7-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm7-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm7-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm7-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >A box containing only 8 yellow balls</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Choose one ball at random from this box.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="120" y="220" width="450" height="340" rx="24" fill="#E8F2FB" stroke="#246DA8" stroke-width="3" /><circle cx="210" cy="330" r="29" fill="#FFF3CB" stroke="#B8750C" stroke-width="3" /><circle cx="305" cy="330" r="29" fill="#FFF3CB" stroke="#B8750C" stroke-width="3" /><circle cx="400" cy="330" r="29" fill="#FFF3CB" stroke="#B8750C" stroke-width="3" /><circle cx="495" cy="330" r="29" fill="#FFF3CB" stroke="#B8750C" stroke-width="3" /><circle cx="210" cy="440" r="29" fill="#FFF3CB" stroke="#B8750C" stroke-width="3" /><circle cx="305" cy="440" r="29" fill="#FFF3CB" stroke="#B8750C" stroke-width="3" /><circle cx="400" cy="440" r="29" fill="#FFF3CB" stroke="#B8750C" stroke-width="3" /><circle cx="495" cy="440" r="29" fill="#FFF3CB" stroke="#B8750C" stroke-width="3" /><rect x="720" y="235" width="335" height="44" rx="10" fill="#FFF3CB" stroke="none" stroke-width="0" /><text x="887.5" y="265" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#B8750C" text-anchor="middle" >Choose a yellow ball</text><text x="888" y="325" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#167754" text-anchor="middle" >CERTAIN</text><rect x="720" y="405" width="335" height="44" rx="10" fill="#FBEDEA" stroke="none" stroke-width="0" /><text x="887.5" y="435" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#BC4740" text-anchor="middle" >Choose a red ball</text><text x="888" y="495" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#BC4740" text-anchor="middle" >IMPOSSIBLE</text><text x="600" y="630" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#5F746C" text-anchor="middle" >An event is possible when it may happen or may not happen.</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >The balls in the box determine the conclusion.</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>