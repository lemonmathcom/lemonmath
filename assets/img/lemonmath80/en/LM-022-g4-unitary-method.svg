<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm22-title lm22-desc"><title id="lm22-title">The unitary method: bags of sweets</title><desc id="lm22-desc">The unitary method: bags of sweets. 6 equal bags contain 48 sweets. How many are in 9 bags?</desc><defs><marker id="lm22-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm22-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm22-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm22-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm22-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm22-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >The unitary method: bags of sweets</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >6 equal bags contain 48 sweets. How many are in 9 bags?</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="80" y="210" width="280" height="330" rx="14" fill="#E7F4EB" stroke="none" stroke-width="0" /><text x="100" y="246" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >6 bags</text><text x="220" y="360" font-family="Arial, sans-serif" font-size="37" font-weight="600" fill="#167754" text-anchor="middle" >48 sweets</text><rect x="460" y="210" width="280" height="330" rx="14" fill="#FFF3CB" stroke="none" stroke-width="0" /><text x="480" y="246" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >1 bag</text><text x="600" y="360" font-family="Arial, sans-serif" font-size="37" font-weight="600" fill="#167754" text-anchor="middle" >8 sweets</text><circle cx="537" cy="420" r="10" fill="#B8750C" stroke="none" stroke-width="0" /><circle cx="579" cy="420" r="10" fill="#B8750C" stroke="none" stroke-width="0" /><circle cx="621" cy="420" r="10" fill="#B8750C" stroke="none" stroke-width="0" /><circle cx="663" cy="420" r="10" fill="#B8750C" stroke="none" stroke-width="0" /><circle cx="537" cy="462" r="10" fill="#B8750C" stroke="none" stroke-width="0" /><circle cx="579" cy="462" r="10" fill="#B8750C" stroke="none" stroke-width="0" /><circle cx="621" cy="462" r="10" fill="#B8750C" stroke="none" stroke-width="0" /><circle cx="663" cy="462" r="10" fill="#B8750C" stroke="none" stroke-width="0" /><rect x="840" y="210" width="280" height="330" rx="14" fill="#E7F4EB" stroke="none" stroke-width="0" /><text x="860" y="246" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#183B34" text-anchor="start" >9 bags</text><text x="980" y="360" font-family="Arial, sans-serif" font-size="37" font-weight="600" fill="#167754" text-anchor="middle" >72 sweets</text><line x1="365" y1="365" x2="440" y2="365" fill="none" stroke="#246DA8" stroke-width="4" stroke-linecap="round"  marker-end="url(#lm22-blue)" /><text x="405" y="315" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#246DA8" text-anchor="middle" >: 6</text><line x1="745" y1="365" x2="820" y2="365" fill="none" stroke="#246DA8" stroke-width="4" stroke-linecap="round"  marker-end="url(#lm22-blue)" /><text x="782" y="315" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#246DA8" text-anchor="middle" >× 9</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >48 : 6 = 8  ·  8 × 9 = 72</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>