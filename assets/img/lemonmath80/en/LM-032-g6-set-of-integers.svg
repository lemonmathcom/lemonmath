evel is negative.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><rect x="70" y="435" width="1060" height="205" rx="0" fill="#E8F2FB" stroke="none" stroke-width="2" /><path d="M100,435 L320,185 L540,435 Z" fill="#E7F4EB" stroke="#167754" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M270,242 L320,185 L367,241 L341,232 L320,251 L296,232 Z" fill="#FFFFFF" stroke="#167754" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="70" y1="435" x2="1130" y2="435" fill="none" stroke="#246DA8" stroke-width="4" stroke-linecap="round"  /><rect x="715" y="398" width="350" height="44" rx="10" fill="#E8F2FB" stroke="none" stroke-width="0" /><text x="890" y="428" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#246DA8" text-anchor="middle" >Sea level: 0 m</text><line x1="580" y1="432" x2="580" y2="190" fill="none" stroke="#167754" stroke-width="3" stroke-linecap="round"  marker-end="url(#lm32-green)" /><text x="660" y="245" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#167754" text-anchor="middle" >+1 250 m</text><ellipse cx="390" cy="565" rx="100" ry="34" fill="#FFF3CB" stroke="#B8750C" stroke-width="3" /><rect x="365" y="515" width="50" height="25" rx="5" fill="#FFF3CB" stroke="#B8750C" stroke-width="2" /><line x1="580" y1="450" x2="580" y2="565" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round"  marker-end="url(#lm32-blue)" /><text x="720" y="565" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#246DA8" text-anchor="middle" >−120 m</text><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >The reference level determines the sign.</text><text x="48" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#5F746C" text-anchor="start" >Heights are not drawn to scale.</text><t