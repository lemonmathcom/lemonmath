<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="lm44-title lm44-desc"><title id="lm44-title">A conical hat and its sector net</title><desc id="lm44-desc">A conical hat and its sector net. Base radius 20 cm, vertical height 15 cm, slant height 25 cm.</desc><defs><marker id="lm44-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#183B34"/></marker><marker id="lm44-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#167754"/></marker><marker id="lm44-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#246DA8"/></marker><marker id="lm44-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#B8750C"/></marker><marker id="lm44-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#BC4740"/></marker><marker id="lm44-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5F746C"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="48" y="48" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#183B34" text-anchor="start" >A conical hat and its sector net</text><text x="48" y="82" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#5F746C" text-anchor="start" >Base radius 20 cm, vertical height 15 cm, slant height 25 cm.</text><line x1="48" y1="106" x2="1152" y2="106" fill="none" stroke="#DBE6E0" stroke-width="1.5" stroke-linecap="round"  /><polygon points="255,275 55,425 455,425" fill="#FFF3CB" stroke="#B8750C" stroke-width="3" stroke-linejoin="round" /><ellipse cx="255" cy="425" rx="200" ry="52" fill="#FFF3CB" stroke="#B8750C" stroke-width="3" /><line x1="255" y1="275" x2="255" y2="425" fill="none" stroke="#246DA8" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="255" y1="425" x2="455" y2="425" fill="none" stroke="#167754" stroke-width="3" stroke-linecap="round"  /><path d="M255,407 L273,407 L273,425" fill="none" stroke="#183B34" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="255" y="245" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#183B34" text-anchor="middle" >S</text><text x="260" y="390" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#246DA8" text-anchor="start" >15 cm</text><text x="335" y="458" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#167754" text-anchor="start" >20 cm</text><text x="100" y="345" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#B8750C" text-anchor="start" >25 cm</text><path d="M890,390 L716.0613462093863,263.62617075711825 A215,215 0 1 1 716.0613462093863,516.3738292428818 Z" fill="#E7F4EB" stroke="#167754" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="890" y1="390" x2="716.0613462093863" y2="263.62617075711825" fill="none" stroke="#B8750C" stroke-width="3" stroke-linecap="round"  /><text x="850" y="300" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#B8750C" text-anchor="middle" >25 cm</text><text x="963" y="420" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#167754" text-anchor="middle" >288°</text><text x="890" y="655" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#167754" text-anchor="middle" >Arc length = 40π cm</text><line x1="505" y1="440" x2="610" y2="440" fill="none" stroke="#5F746C" stroke-width="4" stroke-linecap="round"  marker-end="url(#lm44-muted)" /><text x="600" y="733" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#167754" text-anchor="middle" >Lateral area = π × 20 × 25 = 500π ≈ 1 571 cm²</text><text x="1152" y="775" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#167754" text-anchor="end" >LemonMath</text></svg>